/* ============================ atualização de números ============================ */
function put(key,txt){ document.querySelectorAll(`[data-calc="${key}"]`).forEach(e=>e.textContent=txt); }
function refresh(){
  if(state.view!=="viagem") return;
  const t=trip(); if(!t) return;
  const c=compute(t);
  for(const cat of CATS){
    put("cat:"+cat.key, brl(c.cats[cat.key]));
    put("catfx:"+cat.key, fx(c.cats[cat.key]/(num(t.cambio)||1),t));
    (t[cat.key]||[]).forEach((r,i)=>{
      const v=c.rows[cat.key][i];
      put(`row:${cat.key}:${r.id}`, brl(v.brl));
      put(`rowfx:${cat.key}:${r.id}`, fx(v.fxv,t));
    });
  }
  put("reserva", brl(c.reserva));
  put("reservafx", fx(c.reserva/(num(t.cambio)||1),t));
  put("total", brl(c.total));
  put("totalfx", fx(c.totalFx,t)+" · câmbio "+fmt(num(t.cambio),4));
  put("cambiouso", "R$ "+fmt(num(t.cambio),4));
  /* o campo Pax em branco herda as pessoas da viagem: o marcador tem de acompanhar */
  const paxTxt=String(totalPax(t)||"");
  document.querySelectorAll('[data-p$=".pax"]').forEach(e=>{ e.placeholder=paxTxt; });
  const mb=document.getElementById("metabox");
  if(mb){
    if(c.meta>0){
      const pct=Math.min(100, c.total/c.meta*100);
      mb.innerHTML=`
        <div class="meter${c.excedente>0?" estourou":""}"><i style="width:${pct.toFixed(1)}%"></i></div>
        <div class="kv"><span>Lançamentos</span><b>${brl(c.sub)}</b></div>
        <div class="kv"><span>Reserva</span><b>${brl(c.reserva)}</b></div>
        <div class="kv"><span>Teto de orçamento</span><b>${brl(c.meta)}</b></div>
        ${c.excedente>0
          ? `<p class="hint neg" style="margin-top:8px">Passou do teto em <b>${brl(c.excedente)}</b>.</p>`
          : `<p class="hint" style="margin-top:8px">Ainda cabem ${brl(c.meta-c.total)} dentro do teto.</p>`}`;
    }else{
      mb.innerHTML = c.reserva>0
        ? `<div class="kv" style="margin-top:12px"><span>Lançamentos</span><b>${brl(c.sub)}</b></div>
           <div class="kv"><span>Reserva</span><b>${brl(c.reserva)}</b></div>`
        : "";
    }
  }
  put("pax", String(c.pax));
  put("dias", String(c.dias));
  put("pp", brl(c.porPessoa));
  put("ppd", brl(c.porPessoaDia));

  const rt=document.querySelector('[data-calc="restxt"]');
  if(rt){
    if(c.meta>0){
      rt.className=c.excedente>0?"neg":"";
      rt.innerHTML=c.excedente>0
        ? `Lançamentos <b>${brl(c.sub)}</b> + reserva <b>${brl(c.reserva)}</b> = <b>${brl(c.total)}</b>, `+
          `<b>${brl(c.excedente)}</b> acima do teto de ${brl(c.meta)}.`
        : `Lançamentos <b>${brl(c.sub)}</b> + reserva <b>${brl(c.reserva)}</b> = <b>${brl(c.total)}</b>, `+
          `dentro do teto de ${brl(c.meta)} — ainda cabem <b>${brl(c.meta-c.total)}</b>.`;
    }else{
      rt.className="";
      rt.innerHTML=`Lançamentos <b>${brl(c.sub)}</b> + reserva <b>${brl(c.reserva)}</b> = <b>${brl(c.total)}</b>.`;
    }
  }

  // poupança: soma das fontes, cada uma na sua moeda
  const taxa=num(t.cambio)||1;
  const mostrarFX = t.mostrarEm==="FX";
  const dinheiro = v => mostrarFX ? fx(v/taxa,t) : brl(v);
  (t.guardados||[]).forEach(g=>put("gr:"+g.id, dinheiro(valorEmBRL(t,g))));
  const guardadoBRL = totalGuardado(t);
  const falta=Math.max(0,c.total-guardadoBRL);
  put("gtotal", dinheiro(guardadoBRL));
  put("gcusto", dinheiro(c.total));
  put("gfalta", dinheiro(falta));
  const barra=document.querySelector('[data-calc="gbarra"]');
  if(barra) barra.style.width=Math.min(100, c.total>0?guardadoBRL/c.total*100:0).toFixed(1)+"%";

  /* ---- plano de pagamento ---- */
  const mesesPl=mesesDoPlano(t), linhasPl=linhasDoPlano(t);
  let planejado=0;
  const foraDoLugar=[], semPlano=[];
  linhasPl.forEach(l=>{
    const soma=mesesPl.reduce((a,m)=>a+valPlano(t,m,l.k),0);
    planejado+=soma;
    const meta=metaDaLinha(t,l.k,c), falta=Math.round((meta-soma)*100)/100;
    put("pl:"+l.k, fmt(soma));
    put("plf:"+l.k, Math.abs(falta)<0.005 ? "—" : fmt(falta));
    const cel=document.querySelector(`[data-calc="plf:${l.k}"]`);
    if(cel) cel.className="colfim num"+(falta<-0.005?" neg":(Math.abs(falta)<0.005?" ok":" pouco"));
    if(soma>0.005 && Math.abs(falta)>0.005) foraDoLugar.push({nome:l.nome,falta});
    else if(soma<=0.005 && meta>0.005) semPlano.push(l.nome);
  });
  /* aviso: a soma das parcelas de cada categoria tem de bater com o custo dela */
  const av=document.querySelector('[data-calc="plAviso"]');
  if(av){
    if(foraDoLugar.length){
      av.className="aviso ruim";
      av.innerHTML = "As parcelas não fecham: "+foraDoLugar.map(f=>
        f.falta>0 ? `<b>${esc(f.nome)}</b> faltam ${brl(f.falta)}`
                  : `<b>${esc(f.nome)}</b> ${brl(-f.falta)} a mais`).join(" · ")+".";
    }else if(semPlano.length && planejado>0.005){
      av.className="aviso neutro";
      av.innerHTML = "O que já foi lançado fecha certo. Ainda sem parcelas: <b>"+
        semPlano.map(esc).join("</b>, <b>")+"</b>.";
    }else if(semPlano.length){
      av.className="aviso neutro";
      av.innerHTML = "Nada parcelado ainda. Use <b>Parcelar categoria</b> ou <b>Distribuir tudo até a partida</b>.";
    }else{
      av.className="aviso bom";
      av.innerHTML = "Todas as categorias fecham com o custo da viagem.";
    }
  }
  put("plTotal", fmt(planejado));
  /* Pinta célula por célula, do mês mais próximo para o mais distante e, dentro de
     cada mês, de cima para baixo. Só pinta o que o dinheiro cobre por inteiro;
     quando não dá para pagar uma parcela cheia, para de pintar dali em diante. */
  document.querySelectorAll("[data-cel]").forEach(el=>el.classList.remove("coberto","parcial"));
  let acumulado=0, cobertos=0, restaCob=guardadoBRL, acabou=false;
  mesesPl.forEach(m=>{
    const tm=totalMesPlano(t,m);
    acumulado+=tm;
    put("plm:"+m, tm?fmt(tm):"—");
    put("pla:"+m, acumulado?fmt(acumulado):"—");
    if(acabou) return;
    for(const l of linhasPl){
      const v=valPlano(t,m,l.k);
      if(v<=0.005) continue;
      if(restaCob>=v-0.005){
        restaCob-=v; cobertos+=v;
        const cel=document.querySelector(`[data-cel="${m}.${l.k}"]`);
        if(cel) cel.classList.add("coberto");
      }else{ acabou=true; break; }
    }
  });
  put("plSobra", restaCob>0.005 ? brl(restaCob) : "—");
  const fx1=mesesPl.reduce((a,m)=>a+valPlano(t,m,"compraFX"),0);
  put("plFX", fmt(fx1));
  put("plFXbrl", fmt(fx1*taxa));
  put("plDisp", brl(guardadoBRL));
  put("plCob", brl(cobertos));
  put("plDesc", brl(Math.max(0,planejado-cobertos)));
  let meses=0;
  if(t.inicio){
    const hoje=new Date(), ini=new Date(t.inicio+"T12:00");
    meses=Math.max(0,(ini.getFullYear()-hoje.getFullYear())*12+(ini.getMonth()-hoje.getMonth()));
  }
  const porMes = meses>0 ? falta/meses : 0;
  put("mensal", meses>0?dinheiro(porMes)+"/mês":"—");
  put("mensalfx", meses>0&&!mostrarFX?fx(porMes/taxa,t)+"/mês":"");
  const nF=(t.guardados||[]).length;
  const mt=document.querySelector('[data-calc="mensaltxt"]');
  if(mt) mt.innerHTML = meses>0
    ? `${nF?`Somando ${nF} ${nF===1?"fonte":"fontes"}, você tem <b>${dinheiro(guardadoBRL)}</b>. `:""}`+
      `Faltam <b>${dinheiro(falta)}</b> em <b>${meses}</b> ${meses===1?"mês":"meses"}: <b>${dinheiro(porMes)}</b> por mês.`
    : (t.inicio? `A viagem já começou ou é neste mês. Faltam <b>${dinheiro(falta)}</b>.`
              : `Informe a data de início para calcular o quanto guardar por mês.`);

  // banda lateral
  const band=document.getElementById("asideband"), key=document.getElementById("asidekey");
  if(band){
    const segs=CATS.map(k=>({cor:k.cor,v:c.cats[k.key],n:k.nome}))
      .concat([{cor:"var(--slate)",v:Math.max(0,c.reserva),n:"Reserva"}]).filter(s=>s.v>0);
    const soma=segs.reduce((s,x)=>s+x.v,0)||1;
    band.innerHTML=segs.map(s=>`<i style="width:${(s.v/soma*100).toFixed(2)}%;background:${s.cor}"></i>`).join("");
    key.innerHTML=segs.map(s=>`<span><i class="dot" style="background:${s.cor}"></i>${s.n} ${(s.v/soma*100).toFixed(0)}%</span>`).join("");
  }

  // sensibilidade de câmbio
  const sens=document.getElementById("sens");
  if(sens){
    const r=num(t.cambio)||1;
    const taxas=[...new Set([r-1,r-0.5,r,r+0.5,r+1].map(x=>Math.round(x*100)/100))].filter(x=>x>0);
    sens.innerHTML=taxas.map(x=>`<tr class="${Math.abs(x-r)<0.001?"here":""}"><td>${fmt(x,2)}</td><td>${brl(c.totalFx*x)}</td></tr>`).join("");
  }
  renderYears();
  paintStatus();
}
function paintStatus(){
  const el=document.getElementById("status"); if(!el) return;
  const hora=state.sync?state.sync.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
  let txt, cls="";
  if(state.salvando) txt="Gravando…";
  else if(state.erroSync && state.modo!=="local") txt="Banco fora de alcance — alterações guardadas neste navegador.", cls="neg";
  else if(state.modo==="supabase") txt="Supabase"+(hora?" · sincronizado às "+hora:"");
  else if(state.modo==="claude") txt="Salvo na sua conta"+(hora?" · "+hora:"");
  else txt="Só neste navegador. Exporte de vez em quando para ter backup.";
  el.className="status "+cls;
  el.innerHTML=`<span>${esc(txt)}</span>`+
    (state.modo!=="local"?` <button class="btn small ghost" data-act="sync" style="padding:2px 8px;font-size:12px">Recarregar</button>`:"");
}

/* ============================ render principal ============================ */
function render(){
  document.getElementById("app").innerHTML = state.view==="viagem" ? viewTrip() : viewAno();
  if(state.view==="viagem"){ renderCambio(); }
  renderYears();
  refresh();
  paintStatus();
  renderModal();
  if(state.view==="viagem"){
    const tp=trip();
    if(tp && state.abertos && state.abertos.poupanca){
      const faltam=[...new Set((tp.guardados||[])
        .filter(g=>g.moeda && g.moeda!=="BRL" && g.moeda!==tp.moeda && !num(g.taxa))
        .map(g=>g.moeda))];
      faltam.forEach(m=>garantirTaxa(m));
    }
    const t=trip(), c=state.cotacao;
    if(t && t.cambioAuto && !state.buscandoCotacao){
      const velha=!c || c.moeda!==t.moeda || (Date.now()-(c.quando?c.quando.getTime():0)>36e5);
      if(velha) atualizarCotacao(true);
    }
  }
}

/* ============================ modal ============================ */
function renderModal(){
  const ov=document.getElementById("overlay");
  if(!state.modal){ ov.innerHTML=""; return; }
  if(state.modal==="nova"){
    const y=state.ano;

      <h2>Nova viagem em ${y}</h2>

        <div class="f"><label>Início</label><input id="n_ini" type="date" value="${y}-01-01"></div>
        <div class="f"><label>Fim</label><input id="n_fim" type="date" value="${y}-01-10"></div>
        <div class="f"><label>Adultos</label><input id="n_ad" type="text" inputmode="numeric" value="2"></div>
        <div class="f"><label>Crianças</label><input id="n_cr" type="text" inputmode="numeric" value="0"></div>
        <div class="f"><label>Moeda</label><select id="n_moeda">${Object.entries(MOEDAS).map(([k,v])=>`<option value="${k}">${k} — ${v.n}</option>`).join("")}</select></div>

      </div>
      <div class="acts"><button class="btn ghost" data-act="fechar">Cancelar</button>
      <button class="btn primary" data-act="criar">Criar viagem</button></div>
    </div></div>`;
    setTimeout(()=>{const e=document.getElementById("n_nome"); if(e) e.focus();},30);
  }
  if(state.modal==="voos"){ ov.innerHTML=modalVoos(); return; }
  if(state.modal==="hoteis"){ ov.innerHTML=modalHoteis(); return; }
  if(state.modal==="atracoes"){ ov.innerHTML=modalAtracoes(); return; }
  if(state.modal==="parcelar"){ ov.innerHTML=modalParcelar(); previaParcelas(); return; }
  if(state.modal==="mapa"){ ov.innerHTML=modalMapa(); return; }
  if(state.modal==="local"){ ov.innerHTML=modalLocal(); renderPainelLocal(); return; }
  if(state.modal==="importar"){ ov.innerHTML=modalImportar(); return; }
  if(state.modal==="ano"){
    ov.innerHTML=`<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-label="Adicionar ano">
      <h2>Adicionar ano</h2><p class="sub">Escolha o ano que quer planejar.</p>
      <div class="fields"><div class="f"><label>Ano</label><input id="n_ano" type="text" inputmode="numeric" value="${state.ano+1}"></div></div>
      <div class="acts"><button class="btn ghost" data-act="fechar">Cancelar</button>
      <button class="btn primary" data-act="criarano">Adicionar</button></div>
    </div></div>`;
    setTimeout(()=>{const e=document.getElementById("n_ano"); if(e){e.focus();e.select();}},30);
  }
}
function modalImportar(){

        <td style="padding-top:7px"><b>Total</b></td><td></td>
        <td class="ta-r" style="padding-top:7px"><b>${brl(r.calc.total)}</b><br><span style="font-weight:400;color:var(--ink-3)">${fx(r.calc.totalFx,t)}</span></td>
      </tr></tfoot>
    </table>

    <div class="fields" style="margin-top:18px">
      <div class="f span2"><label>Nome da viagem</label><input id="i_nome" type="text" value="${esc(t.nome)}"></div>
      <div class="f"><label>Início</label><input id="i_ini" type="date" value="${esc(t.inicio)}"></div>
      <div class="f"><label>Fim</label><input id="i_fim" type="date" value="${esc(t.fim)}"></div>
      <div class="f"><label>Adultos</label><input id="i_ad" type="text" inputmode="numeric" value="${num(t.adultos)}"></div>
      <div class="f"><label>Crianças</label><input id="i_cr" type="text" inputmode="numeric" value="${num(t.criancas)}"></div>
      <div class="f"><label>Moeda</label><select id="i_moeda">${moedaOpts}</select></div>
      <div class="f"><label>R$ por 1 ${esc(sym)}</label><input id="i_cambio" type="text" inputmode="decimal" value="${fmt(num(t.cambio),4)}"></div>
    </div>

    ${r.avisos.length?`<div style="border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:0 0 18px">
      ${r.avisos.map(a=>`<p style="margin:0 0 6px;font-size:13px;color:var(--ink-2)">${esc(a)}</p>`).join("")}

    <div class="acts">

      <button class="btn primary" data-act="confirmarimport">Importar viagem</button>

  </div></div>`;
}
function toast(msg){
  const d=document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}

/* ============================ eventos ============================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button, [data-scrim]"); if(!t) return;

  if(t.dataset.ano){ state.ano=+t.dataset.ano; state.view="ano"; state.tripId=null; saveUi(); render(); return; }
  if(t.dataset.addyear){ state.modal="ano"; renderModal(); return; }
  if(t.dataset.open){ state.tripId=t.dataset.open; state.view="viagem"; state.abertos={}; saveUi(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.cattoggle){
    const k=t.dataset.cattoggle, aberto=!state.abertos[k];
    state.abertos[k]=aberto;
    const item=document.querySelector(`.catitem[data-item="${k}"]`);
    if(item){ item.classList.toggle("aberto",aberto); t.setAttribute("aria-expanded",String(aberto)); }
    return;
  }
  if(t.dataset.scrim && t.dataset.scrim==="1" && e.target===t){
    if(mapaInst){ mapaInst.remove(); mapaInst=null; }
    state.modal=null; state.importado=null; renderModal(); return;
  }

  const act=t.dataset.act;
  if(act==="voltar"){ state.view="ano"; state.tripId=null; state.abertos={}; saveUi(); render(); return; }
  if(act==="nova"){ state.modal="nova"; renderModal(); return; }
  if(act==="fechar"){ state.modal=null; state.importado=null; state.voos=null; state.hoteis=null; state.atr=null; renderModal(); return; }
  if(act==="criar"){
    const v=id=>document.getElementById(id).value;
    const nt=novaViagem({ano:state.ano,nome:v("n_nome"),destino:v("n_dest"),inicio:v("n_ini"),fim:v("n_fim"),
      adultos:v("n_ad"),criancas:v("n_cr"),moeda:v("n_moeda"),cambio:v("n_cambio")});
    if(nt.inicio) nt.ano=+nt.inicio.slice(0,4);
    state.trips.push(nt); state.modal=null; state.tripId=nt.id; state.view="viagem"; state.ano=nt.ano;
    touch(nt.id); saveUi(); render(); return;
  }
  if(act==="confirmarimport"){
    const r=state.importado; if(!r) return;
    const t=r.trip, v=id=>{const e=document.getElementById(id); return e?e.value:"";};
    t.nome=v("i_nome").trim()||"Viagem importada";
    t.inicio=v("i_ini"); t.fim=v("i_fim");
    t.adultos=num(v("i_ad"))||1; t.criancas=num(v("i_cr"));
    t.moeda=v("i_moeda")||t.moeda; t.cambio=num(v("i_cambio"))||t.cambio;
    if(t.inicio) t.ano=+t.inicio.slice(0,4);
    if(state.trips.some(x=>x.id===t.id)) t.id=uid();
    state.trips.push(t);
    state.modal=null; state.importado=null;
    state.ano=t.ano; state.tripId=t.id; state.view="viagem"; state.abertos={};
    touch(t.id); saveUi(); render(); window.scrollTo(0,0);
    toast("Viagem importada da planilha");
    return;
  }
  if(act==="criarano"){
    const a=parseInt(document.getElementById("n_ano").value,10);
    if(a>1900&&a<2200){ state.ano=a; state.view="ano"; state.tripId=null; }
    state.modal=null; saveUi(); render(); return;
  }
  if(act==="duplicar"){
    const o=trip(); if(!o) return;
    const c=JSON.parse(JSON.stringify(o));
    c.id=uid(); c.nome=o.nome+" (cópia)";
    for(const cat of CATS) (c[cat.key]||[]).forEach(r=>r.id=uid());
    state.trips.push(c); state.tripId=c.id; touch(c.id); render(); toast("Viagem duplicada"); return;
  }
  if(act==="excluir"){
    const o=trip(); if(!o) return;
    if(!confirm(`Excluir "${o.nome}" e todos os seus lançamentos?`)) return;
    state.trips=state.trips.filter(x=>x.id!==o.id);
    dirty.add(o.id); saveLocal(); flush();
    state.view="ano"; state.tripId=null; state.abertos={}; render(); toast("Viagem excluída"); return;
  }
  if(act==="sync"){ recarregar(); return; }
  if(act==="buscarcambio"){ atualizarCotacao(false); return; }
  if(act==="usarcambio"){
    const tr=trip(), c=state.cotacao;
    if(!tr||!c||c.erro) return;
    tr.cambio=Math.round(taxaComIOF(tr,c.turismo)*10000)/10000;
    tr.cambioFonte=c.fonte; tr.cambioEm=c.quando.toISOString();
    touch(tr.id); render();
    toast("Câmbio atualizado para R$ "+fmt(tr.cambio,4));
    return;
  }
  if(act==="export"){ exportar(); return; }
  if(act==="import"){ importar(); return; }

  if(t.dataset.addg){
    const tr=trip(); if(!tr) return;
    tr.guardados=tr.guardados||[];
    const ult=tr.guardados[tr.guardados.length-1];
    const m=ult?ult.moeda:"BRL";
    tr.guardados.push({id:uid(),fonte:"",moeda:m,valor:0,taxa:taxaPadrao(tr,m)});
    state.abertos.poupanca=true; touch(tr.id); render();
    garantirTaxa(m); garantirTaxa(m);
    const ins=document.querySelectorAll('[data-g$=".fonte"]');
    if(ins.length) ins[ins.length-1].focus();
    return;
  }
  if(t.dataset.delg){
    const tr=trip(); if(!tr) return;
    tr.guardados=(tr.guardados||[]).filter(g=>g.id!==t.dataset.delg);
    touch(tr.id); render(); return;
  }
  if(t.dataset.mostrar){
    const tr=trip(); if(!tr) return;
    tr.mostrarEm=t.dataset.mostrar; touch(tr.id); render(); return;
  }
  if(act==="taxasguardado"){ atualizarTaxasGuardadas(); return; }
  if(t.dataset.busca){
    const [cat,id]=t.dataset.busca.split(":");
    if(cat==="passagens") buscarVoos(id);
    else if(cat==="hospedagem") buscarHoteis(id);
    else buscarAtracoes(id);
    return;
  }
  if(t.dataset.usarvoo!==undefined){ usarVoo(+t.dataset.usarvoo); return; }
  if(t.dataset.precovoo){
    const tr=trip(); if(!tr) return;
    tr.precoVooTotal = t.dataset.precovoo==="total";
    touch(tr.id); renderModal(); return;
  }
  if(act==="rebuscar"){ if(state.voos) buscarVoos(state.voos.linha); return; }
  if(t.dataset.usarhotel!==undefined){ usarHotel(+t.dataset.usarhotel); return; }
  if(act==="rebuscarhotel"){ if(state.hoteis) buscarHoteis(state.hoteis.linha); return; }
  if(t.dataset.usaratr!==undefined){ usarAtracao(+t.dataset.usaratr); return; }
  if(t.dataset.filtroatr){ if(state.atr){ state.atr.filtro=t.dataset.filtroatr; renderModal(); } return; }
  if(act==="rebuscaratr"){
    const e=document.getElementById("atrtermo"), tr=trip();
    if(state.atr&&tr){
      const r=(tr.atracoes||[]).find(x=>x.id===state.atr.linha);
      if(r){ r.termoBusca=e?e.value:""; touch(tr.id); }
      buscarAtracoes(state.atr.linha);
    }
    return;
  }
  if(act==="parcelar"){ state.modal="parcelar"; renderModal(); return; }
  if(act==="lancarparcelas"){ lancarParcelas(); return; }
  if(act==="distribuirplano"){ state.abertos.plano=true; distribuirPlano(); return; }
  if(act==="limparplano"){ limparPlano(); return; }
  if(act==="maismes"){
    const tr=trip(); if(!tr) return;
    tr.mesesExtra=num(tr.mesesExtra)+1; state.abertos.plano=true; touch(tr.id); render(); return;
  }
  if(t.dataset.addr){
    const tr=trip(); if(!tr) return;
    tr.roteiro=tr.roteiro||[];
    tr.roteiro.push({id:uid(),cidade:"",pais:"",chegada:"",saida:""});
    state.abertos.mapa=true; touch(tr.id); render();
    const ins=document.querySelectorAll('[data-r$=".cidade"]');
    if(ins.length) ins[ins.length-1].focus();
    return;
  }
  if(t.dataset.delr){
    const tr=trip(); if(!tr) return;
    tr.roteiro=(tr.roteiro||[]).filter(r=>r.id!==t.dataset.delr);
    touch(tr.id); render(); return;
  }
  if(act==="dashosp"){
    const tr=trip(); if(!tr) return;
    const jaTem=new Set((tr.roteiro||[]).map(r=>nz(r.cidade)));
    let n=0;
    (tr.hospedagem||[]).forEach(hh=>{
      const cid=String(hh.local||"").replace(/\s*\(.*\)\s*/,"").trim();
      if(!cid||jaTem.has(nz(cid))) return;
      jaTem.add(nz(cid));
      tr.roteiro.push({id:uid(),cidade:cid,pais:"",chegada:hh.checkin||"",saida:hh.checkout||""});
      n++;
    });
    touch(tr.id); render();
    toast(n?`${n} ${n===1?"parada trazida":"paradas trazidas"} das hospedagens`:"Nada novo para trazer");
    return;
  }
  if(act==="salvarchave"){
    const e=document.getElementById("gmapskey");
    salvarChaveGoogle(e?e.value:"");
    googleP=null; apiMapa=null; motorMapa="";
    render(); toast(chaveGoogle()?"Chave salva — os mapas passam a usar o Google":"Mapas voltaram ao OpenStreetMap");
    return;
  }
  if(act==="chavepadrao"){
    restaurarChavePadrao(); googleP=null; apiMapa=null; motorMapa="";
    render(); toast("Voltando à chave padrão do app"); return;
  }
  if(act==="localizar"){ localizarParadas(); return; }
  if(act==="mostrarmapa"){ abrirMapa(); return; }
  if(act==="turismolocal"){ abrirLocal(); return; }
  if(act==="novoLocal"){
    const tr=trip(); if(!tr) return;
    const nv={id:uid(),nome:"Novo roteiro",cidade:"",pais:"",pontos:[]};
    tr.locais=tr.locais||[]; tr.locais.push(nv); state.localId=nv.id;
    state.sugestoes=[]; state.distRes=null; state.otim=null; touch(tr.id);
    if(apiMapa) desenharLocais(apiMapa);
    renderPainelLocal();
    const n=document.getElementById("locNome"); if(n){ n.focus(); n.select(); }
    return;
  }
  if(act==="duplicarLocal"){
    const tr=trip(), l=localAtual(); if(!tr||!l) return;
    const c=JSON.parse(JSON.stringify(l));
    c.id=uid(); c.nome=(l.nome||l.cidade||"Roteiro")+" (cópia)";
    (c.pontos||[]).forEach(p=>p.id=uid());
    tr.locais.push(c); state.localId=c.id; state.otim=null; state.distRes=null;
    touch(tr.id); if(apiMapa) desenharLocais(apiMapa);
    renderPainelLocal(); toast("Roteiro duplicado"); return;
  }
  if(act==="excluirLocal"){
    const tr=trip(), l=localAtual(); if(!tr||!l) return;
    if(!confirm(`Excluir o roteiro "${l.nome}" e seus ${(l.pontos||[]).length} pontos?`)) return;
    tr.locais=tr.locais.filter(x=>x.id!==l.id);
    state.localId=(tr.locais[0]&&tr.locais[0].id)||null;
    state.sugestoes=[]; state.distRes=null; touch(tr.id);
    if(apiMapa) desenharLocais(apiMapa);
    renderPainelLocal(); return;
  }
  if(act==="irCidade"){ irParaCidade(); return; }
  if(act==="sugerir"){
    const l=localAtual(); if(!l) return;
    toast("Procurando atrações…");
    sugerirAtracoes(l).then(r=>{
      state.sugestoes=r; renderPainelLocal();
      if(!r.length) toast("Nada encontrado por aqui");
    }).catch(e=>toast(String(e.message||e)));
    return;
  }
  if(act==="fecharSug"){ state.sugestoes=[]; renderPainelLocal(); return; }
  if(t.dataset.addsug!==undefined){
    const sg=state.sugestoes[+t.dataset.addsug];
    if(sg) addPonto(sg.nome,sg.lat,sg.lon,sg.tipo);
    return;
  }
  if(t.dataset.visitado){
    const l=localAtual(); if(!l) return;
    const p=(l.pontos||[]).find(x=>x.id===t.dataset.visitado); if(!p) return;
    p.visitado=!p.visitado; touch(trip().id);
    if(apiMapa) desenharLocais(apiMapa);
    renderPainelLocal(); return;
  }
  if(t.dataset.delponto){
    const l=localAtual(); if(!l) return;
    l.pontos=(l.pontos||[]).filter(p=>p.id!==t.dataset.delponto);
    state.distRes=null; touch(trip().id);
    if(apiMapa) desenharLocais(apiMapa);
    renderPainelLocal(); return;
  }
  if(t.dataset.sugponto!==undefined){
    const sg=(state.autoc||[])[+t.dataset.sugponto];
    if(sg){
      addPonto(sg.nome,sg.lat,sg.lon,sg.detalhe);
      const ip=document.getElementById("buscaPonto"); if(ip) ip.value="";
      state.autoc=[]; const dd=document.getElementById("sugBusca"); if(dd) dd.innerHTML="";
    }
    return;
  }
  if(act==="calcDist"){ calcularDistancia(); return; }
  if(act==="otimizar"){ calcularMelhorRoteiro(); return; }
  if(act==="aplicarordem"){ aplicarMelhorOrdem(); return; }
  if(t.dataset.perfil){
    state.otimPerfil=t.dataset.perfil; state.otim=null; renderPainelLocal(); return;
  }
  if(act==="fecharmapa"){
    if(mapaInst){ mapaInst.remove(); mapaInst=null; }
    camadasLocais={pinos:[],rotas:[]};
    state.modal=null; renderModal(); return;
  }
  if(t.dataset.perna!==undefined){
    const v=t.dataset.perna;
    state.perna = (v==="todas"||v==="nenhuma") ? v : +v;
    aplicarPerna(); return;
  }
  if(t.dataset.add){
    const cat=CATMAP[t.dataset.add], tr=trip(); if(!cat||!tr) return;
    tr[cat.key]=tr[cat.key]||[];
    tr[cat.key].push(Object.assign({id:uid()},cat.add));
    state.abertos[cat.key]=true;
    touch(tr.id); render();
    const rows=document.querySelectorAll(`[data-cat="${cat.key}"] .lrow input`);
    if(rows.length) rows[rows.length-1].focus();
    return;
  }
  if(t.dataset.del){
    const [k,id]=t.dataset.del.split("."), tr=trip(); if(!tr) return;
    tr[k]=tr[k].filter(r=>r.id!==id); touch(tr.id); render(); return;
  }
  if(t.dataset.cur){
    const [k,id]=t.dataset.cur.split("."), tr=trip(); if(!tr) return;
    const r=tr[k].find(x=>x.id===id); if(!r) return;
    r.cur = r.cur==="FX" ? "BRL" : "FX";
    touch(tr.id); render(); return;
  }
  if(t.dataset.guardadocur){
    const tr=trip(); if(!tr) return;
    tr.guardadoCur = tr.guardadoCur==="FX" ? "BRL" : "FX";
    touch(tr.id); render(); return;
  }
  if(t.dataset.rescur){
    const tr=trip(); if(!tr) return;
    tr.reservaCur = tr.reservaCur==="FX"?"BRL":"FX"; touch(tr.id); render(); return;
  }
  if(t.dataset.metacur){
    const tr=trip(); if(!tr) return;
    tr.metaCur = tr.metaCur==="FX"?"BRL":"FX"; touch(tr.id); render(); return;
  }

  if(t.id==="themeBtn"){
    const cur=document.documentElement.getAttribute("data-theme");
    const next = cur==="dark" ? "light" : cur==="light" ? "" : "dark";
    if(next) document.documentElement.setAttribute("data-theme",next);
    else document.documentElement.removeAttribute("data-theme");
    try{ localStorage.setItem("rotag.theme",next); }catch(e){}
    return;
  }
});

/* digitação nos campos */
let tmrAutoc=null;
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.isContentEditable) return;

  if(el.dataset.pt){
    const [id,campo]=el.dataset.pt.split("."), l=localAtual(); if(!l) return;
    const p=(l.pontos||[]).find(x=>x.id===id); if(!p) return;
    p[campo]=el.value; touch(trip().id); return;
  }
  if(el.id==="locNome"){
    const l=localAtual(); if(!l) return;
    l.nome=el.value; touch(trip().id);
    const sel=document.getElementById("selLocal");
    const op=sel&&sel.querySelector(`option[value="${l.id}"]`);
    if(op) op.textContent=l.nome||l.cidade||"sem nome";
    return;
  }
  if(el.id==="locCidade"){
    const l=localAtual(); if(!l) return;
    l.cidade=el.value; delete l.lat; delete l.lon;
    touch(trip().id); return;
  }
  if(el.id==="buscaPonto"){
    const termo=el.value, dd=document.getElementById("sugBusca");
    clearTimeout(tmrAutoc);
    if(termo.trim().length<3){ if(dd) dd.innerHTML=""; state.autoc=[]; return; }
    if(dd) dd.innerHTML=`<div class="sugcarr">procurando…</div>`;
    tmrAutoc=setTimeout(()=>{
      buscarPontos(termo,localAtual()).then(r=>{
        state.autoc=r;
        const d=document.getElementById("sugBusca"); if(!d) return;
        d.innerHTML = r.length

/* ============================ turismo local ============================ */
/* Pontos de visitação por cidade. Busca e autocompletar: Nominatim (accept-language=pt,
   limitado à caixa da cidade). Sugestões de atrações: Overpass. Distâncias: OSRM público
   da FOSSGIS, que separa os perfis em endpoints — routed-foot e routed-car. */
const NOMINATIM="https://nominatim.openstreetmap.org/search";
const OVERPASS="https://overpass-api.de/api/interpreter";
const OSRM={pe:"routed-foot", carro:"routed-car"};

function localAtual(){
  const t=trip(); if(!t) return null;
  return (t.locais||[]).find(l=>l.id===state.localId) || null;
}
function caixaCidade(l,graus){
  const g=graus||0.25;
  return [l.lon-g, l.lat+g, l.lon+g, l.lat-g].join(",");
}
async function buscarPontos(termo,l){
  const q=String(termo||"").trim();
  if(q.length<3) return [];
  const par=new URLSearchParams({
    q: l&&l.cidade ? q+", "+l.cidade : q,
    format:"jsonv2", limit:"6", addressdetails:"0", "accept-language":"pt-BR,pt"
  });
  if(l&&isFinite(l.lat)&&isFinite(l.lon)){ par.set("viewbox",caixaCidade(l)); par.set("bounded","1"); }
  const r=await fetch(NOMINATIM+"?"+par.toString());
  if(!r.ok) throw new Error("busca indisponível");
  const d=await r.json();
  return (d||[]).map(x=>({
    nome: x.name || String(x.display_name||"").split(",")[0],
    detalhe: String(x.display_name||"").split(",").slice(1,3).join(",").trim(),
    lat:+x.lat, lon:+x.lon
  })).filter(x=>isFinite(x.lat)&&isFinite(x.lon));
}
async function sugerirAtracoes(l){
  if(!l||!isFinite(l.lat)||!isFinite(l.lon)) throw new Error("escolha a cidade primeiro");
  const q=`[out:json][timeout:25];(
    node(around:6000,${l.lat},${l.lon})["tourism"~"^(attraction|museum|viewpoint|artwork|gallery)$"]["name"];
    way(around:6000,${l.lat},${l.lon})["tourism"~"^(attraction|museum|viewpoint)$"]["name"];
    node(around:6000,${l.lat},${l.lon})["historic"~"^(castle|monument|memorial|ruins|archaeological_site)$"]["name"];
  );out center 60;`;
  const r=await fetch(OVERPASS,{method:"POST",body:"data="+encodeURIComponent(q),
    headers:{"Content-Type":"application/x-www-form-urlencoded"}});
  if(!r.ok) throw new Error("serviço de atrações indisponível");
  const d=await r.json();
  const vistos=new Set(), fora=[];
  for(const e of (d.elements||[])){
    const tg=e.tags||{};
    const nome=tg["name:pt"]||tg.name;
    if(!nome) continue;
    const lat=e.lat!=null?e.lat:(e.center&&e.center.lat);
    const lon=e.lon!=null?e.lon:(e.center&&e.center.lon);
    if(!isFinite(lat)||!isFinite(lon)) continue;
    /* o mesmo lugar pode vir como nó e como área, ou com e sem name:pt —
       por isso a chave é o nome E a coordenada arredondada (~10 m) */
    const chaveNome=nz(nome), chaveGeo=lat.toFixed(4)+","+lon.toFixed(4);
    if(vistos.has(chaveNome)||vistos.has(chaveGeo)) continue;
    vistos.add(chaveNome); vistos.add(chaveGeo);
    fora.push({nome,lat,lon,tipo:tg.tourism||tg.historic||""});
  }
  fora.sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
  return fora.slice(0,30);
}

const R_TERRA=6371;
function distanciaReta(a,b){
  const rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R_TERRA*Math.asin(Math.min(1,Math.sqrt(h)));
}
async function rotaEntre(perfil,a,b){
  const base=OSRM[perfil];
  const url=`https://routing.openstreetmap.de/${base}/route/v1/driving/`+
    `${a.lon},${a.lat};${b.lon},${b.lat}?overview=simplified&geometries=geojson`;
  const r=await fetch(url);
  if(!r.ok) throw new Error("roteador respondeu "+r.status);
  const d=await r.json();
  if(d.code!=="Ok"||!d.routes||!d.routes.length) throw new Error(d.message||"sem rota");
  const rt=d.routes[0];
  return {km:rt.distance/1000, min:rt.duration/60,
          linha:(rt.geometry&&rt.geometry.coordinates||[]).map(c=>[c[1],c[0]])};
}
/* ---- melhor ordem de visita ----
   Primeiro tenta o serviço /trip do OSRM, que resolve pelo trajeto real das ruas.
   Se ele não responder, resolvo aqui mesmo: vizinho mais próximo + 2-opt sobre
   distâncias em linha reta. O resultado diz de onde veio, para você saber o que está lendo. */
async function melhorRoteiroOSRM(pontos,perfil,fechado){
  const coords=pontos.map(p=>p.lon+","+p.lat).join(";");
  const par=new URLSearchParams({source:"first",roundtrip:fechado?"true":"false",
                                 overview:"simplified",geometries:"geojson"});
  if(!fechado) par.set("destination","any");
  const url=`https://routing.openstreetmap.de/${OSRM[perfil]}/trip/v1/driving/${coords}?${par.toString()}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error("otimizador respondeu "+r.status);
  const d=await r.json();
  if(d.code!=="Ok"||!d.trips||!d.trips.length) throw new Error(d.message||"sem solução");
  const wp=d.waypoints||[];
  const ordem=pontos.map((p,i)=>({i,pos:wp[i]?wp[i].waypoint_index:i}))
                    .sort((a,b)=>a.pos-b.pos).map(x=>x.i);
  const t=d.trips[0];
  return {ordem, km:t.distance/1000, min:t.duration/60,
          linha:((t.geometry&&t.geometry.coordinates)||[]).map(c=>[c[1],c[0]]), fonte:"osrm"};
}
function melhorRoteiroLocal(pontos,fechado){
  const n=pontos.length;
  const D=[]; for(let i=0;i<n;i++){ D[i]=[]; for(let j=0;j<n;j++) D[i][j]=distanciaReta(pontos[i],pontos[j]); }
  const custo=o=>{ let c=0; for(let k=0;k<o.length-1;k++) c+=D[o[k]][o[k+1]];
                   if(fechado&&o.length>1) c+=D[o[o.length-1]][o[0]]; return c; };
  /* vizinho mais próximo a partir do primeiro ponto */
  let ordem=[0]; const falta=new Set();
  for(let i=1;i<n;i++) falta.add(i);
  while(falta.size){
    const u=ordem[ordem.length-1];
    let melhor=null,md=Infinity;
    falta.forEach(v=>{ if(D[u][v]<md){md=D[u][v];melhor=v;} });
    ordem.push(melhor); falta.delete(melhor);
  }
  /* 2-opt: desfaz cruzamentos */
  let melhorou=true, voltas=0;
  while(melhorou && voltas++<60){
    melhorou=false;
    for(let i=1;i<n-1;i++) for(let j=i+1;j<n;j++){
      const nova=ordem.slice(0,i).concat(ordem.slice(i,j+1).reverse(),ordem.slice(j+1));
      if(custo(nova)<custo(ordem)-1e-9){ ordem=nova; melhorou=true; }
    }
  }
  return {ordem, km:custo(ordem), min:null, linha:null, fonte:"reta"};
}
async function calcularMelhorRoteiro(){
  const l=localAtual(); if(!l||state.otimizando) return;
  const pts=(l.pontos||[]).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
  if(pts.length<3){ toast("São necessários ao menos 3 pontos com coordenada"); return; }
  state.otimizando=true; state.otim=null; renderPainelLocal();
  let res;
  try{ res=await melhorRoteiroOSRM(pts,state.otimPerfil,state.otimFechado); }
  catch(e){ res=melhorRoteiroLocal(pts,state.otimFechado); res.aviso="O otimizador por ruas não respondeu; esta ordem foi calculada em linha reta."; }
  res.ids=res.ordem.map(i=>pts[i].id);
  res.nomes=res.ordem.map(i=>pts[i].nome);
  state.otim=res; state.otimizando=false;
  camadasLocais.rotas.forEach(m=>mapaInst&&mapaInst.removeLayer(m)); camadasLocais.rotas=[];
  if(res.linha&&apiMapa) desenharRota(apiMapa,res.linha,state.otimPerfil==="pe"?"#14614a":"#4a6fa5",state.otimPerfil==="pe");
  else if(apiMapa){
    const seq=res.ordem.map(i=>[pts[i].lat,pts[i].lon]);
    if(state.otimFechado) seq.push(seq[0]);
    desenharRota(apiMapa,seq,"#c08a2e",true);
  }
  renderPainelLocal();
}
function aplicarMelhorOrdem(){
  const l=localAtual(), o=state.otim; if(!l||!o) return;
  const porId={}; (l.pontos||[]).forEach(p=>porId[p.id]=p);
  const novos=o.ids.map(id=>porId[id]).filter(Boolean);
  (l.pontos||[]).forEach(p=>{ if(novos.indexOf(p)<0) novos.push(p); });
  l.pontos=novos; state.otim=null; touch(trip().id);
  if(apiMapa) desenharLocais(apiMapa);
  renderPainelLocal(); toast("Ordem aplicada");
}

function duracao(min){
  const m=Math.round(min);
  if(m<60) return m+" min";
  return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min";
}
function km(v){ return v<1 ? Math.round(v*1000)+" m" : fmt(v,1)+" km"; }

let camadasLocais={pinos:[],rotas:[]};

async function abrirLocal(){

function montarMapaLocal(L){
  const alvo=document.getElementById("mapa"); if(!alvo) return;
  if(mapaInst){ mapaInst.remove(); mapaInst=null; }
  camadasLocais={pinos:[],rotas:[]};
  mapaInst=L.map(alvo,{zoomControl:true,scrollWheelZoom:true});

  alvo.classList.remove("clarear");   /* aqui o mapa fica nítido: sem clarear */
  const l=localAtual();
  mapaInst.setView(l&&isFinite(l.lat)?[l.lat,l.lon]:[38.7,-9.1], l&&isFinite(l.lat)?13:4);

function desenharLocais(L){
  if(!mapaInst||!L) return;
  camadasLocais.pinos.forEach(m=>mapaInst.removeLayer(m));
  camadasLocais.rotas.forEach(m=>mapaInst.removeLayer(m));
  camadasLocais={pinos:[],rotas:[]};
  const l=localAtual(); if(!l) return;
  (l.pontos||[]).forEach((p,i)=>{
    if(!isFinite(p.lat)||!isFinite(p.lon)) return;
    const ic=L.divIcon({className:"",html:`<span class="pin pinlocal${p.visitado?" jafoi":""}"><b>${i+1}</b></span>`,
      iconSize:[28,28],iconAnchor:[14,14],_letra:String(i+1),_cor:p.visitado?"#6b7b76":"#a85b3c"});
    const m=L.marker([p.lat,p.lon],{icon:ic,title:p.nome}).addTo(mapaInst);
    m.bindTooltip(`<b>${esc(p.nome)}</b>${p.obs?`<i>${esc(p.obs)}</i>`:""}${p.visitado?`<i>já visitado</i>`:""}`,
      {direction:"top",offset:[0,-16],className:"rotulo",opacity:1});
    camadasLocais.pinos.push(m);
  });
  const pts=(l.pontos||[]).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
  if(pts.length>1){
    const b=L.latLngBounds(pts.map(p=>[p.lat,p.lon]));
    if(b.isValid()) mapaInst.fitBounds(b,{padding:[70,70],maxZoom:15});
  }else if(pts.length===1) mapaInst.setView([pts[0].lat,pts[0].lon],15);
  else if(isFinite(l.lat)) mapaInst.setView([l.lat,l.lon],13);
}

function desenharRota(L,linha,cor,tracejada){
  if(!mapaInst||!linha||!linha.length) return;
  const base=L.polyline(linha,{color:"#fff",weight:8,opacity:.85}).addTo(mapaInst);
  const via=L.polyline(linha,{color:cor,weight:4,opacity:.95,
    dashArray:tracejada?"1 9":null,lineCap:"round"}).addTo(mapaInst);
  camadasLocais.rotas.push(base,via);
}

async function irParaCidade(){

function addPonto(nome,lat,lon,obs){
  const l=localAtual(); if(!l) return;
  l.pontos=l.pontos||[];
  if(l.pontos.some(p=>nz(p.nome)===nz(nome))){ toast("Esse ponto já está na lista"); return; }
  l.pontos.push({id:uid(),nome,obs:obs||"",lat,lon});
  touch(trip().id);
  if(apiMapa) desenharLocais(apiMapa);
  renderPainelLocal();
}

function pintarDistancia(){
  const alvo=document.getElementById("distRes"); if(!alvo) return;
  const r=state.distRes;
  if(!r){ alvo.innerHTML=""; return; }
  if(r.erro){ alvo.innerHTML=`<p class="hint neg" style="margin-top:8px">${esc(r.erro)}</p>`; return; }
  alvo.innerHTML=`
    <div class="kv"><span>Em linha reta</span><b>${esc(km(r.reta))}</b></div>
    <div class="kv"><span>A pé</span><b>${r.pe?esc(km(r.pe.km)+" · "+duracao(r.pe.min)):"—"}</b></div>
    <div class="kv"><span>De carro</span><b>${r.carro?esc(km(r.carro.km)+" · "+duracao(r.carro.min)):"—"}</b></div>
    ${r.aviso?`<p class="hint" style="margin-top:6px">${esc(r.aviso)}</p>`:""}`;
}

async function calcularDistancia(){
  const l=localAtual(); if(!l) return;
  const dA=document.getElementById("dA"), dB=document.getElementById("dB");
  const a=(l.pontos||[]).find(p=>p.id===(dA&&dA.value));
  const b=(l.pontos||[]).find(p=>p.id===(dB&&dB.value));
  state.distA=dA?dA.value:""; state.distB=dB?dB.value:"";
  if(!a||!b||a===b){ state.distRes={erro:"Escolha dois pontos diferentes."}; pintarDistancia(); return; }
  if(!isFinite(a.lat)||!isFinite(b.lat)){ state.distRes={erro:"Um dos pontos está sem coordenada."}; pintarDistancia(); return; }
  state.distRes={reta:distanciaReta(a,b)}; pintarDistancia();
  camadasLocais.rotas.forEach(m=>mapaInst&&mapaInst.removeLayer(m)); camadasLocais.rotas=[];
  const falhas=[];
  for(const [perfil,cor,trace] of [["pe","#14614a",true],["carro","#4a6fa5",false]]){
    try{
      const rt=await rotaEntre(perfil,a,b);
      state.distRes[perfil]={km:rt.km,min:rt.min};
      if(apiMapa) desenharRota(apiMapa,rt.linha,cor,trace);
    }catch(e){ falhas.push(perfil==="pe"?"a pé":"de carro"); }
    pintarDistancia();
  }
  if(falhas.length) state.distRes.aviso="Não consegui a rota "+falhas.join(" nem ")+" agora.";
  pintarDistancia();
}

/* Funciona com mouse, trackpad e toque (pointer events). As datas pertencem às
   POSIÇÕES: ao mover uma linha, ela assume as datas do lugar para onde foi. */
function alcaHTML(){

let arrasto=null;
function idsDa(lista){
  return [...lista.querySelectorAll(".lrow")].map(x=>x.dataset.rid).filter(Boolean);
}
function aplicarOrdem(tipo,ordem,silencioso){
  const t=trip(); if(!t||!tipo) return;
  const atual = tipo==="roteiro" ? (t.roteiro||[]) : (t[tipo]||[]);
  const porId={}; atual.forEach(r=>porId[r.id]=r);
  const nova=ordem.map(id=>porId[id]).filter(Boolean);
  if(nova.length!==atual.length){ render(); return; }
  if(nova.every((r,i)=>r===atual[i])) return;

  /* As posições que tinham data continuam tendo, e as datas são redistribuídas
     em ordem cronológica — assim a lista sempre se lê de cima para baixo. */
  if(tipo==="roteiro"){
    const datas=atual.map(r=>({c:r.chegada||"",s:r.saida||""}));
    const cheias=datas.filter(d=>d.c||d.s).sort((a,b)=>String(a.c).localeCompare(String(b.c)));
    let k=0;
    datas.forEach((d,i)=>{
      const alvo=(d.c||d.s)?cheias[k++]:{c:"",s:""};
      nova[i].chegada=alvo.c; nova[i].saida=alvo.s;
      nova[i].dias=Math.max(1,difData(alvo.c,alvo.s)||num(nova[i].dias)||1);
    });
    t.roteiro=nova;
  }else{
    const datas=atual.map(r=>r.data||"");
    const cheias=datas.filter(Boolean).sort((a,b)=>a.localeCompare(b));
    let k=0;
    datas.forEach((d,i)=>{ nova[i].data = d ? cheias[k++] : ""; });
    t[tipo]=nova;
  }
  touch(t.id); render();
  if(!silencioso) toast("Ordem atualizada — as datas acompanharam as posições");
}

document.addEventListener("pointerdown",e=>{
  const g=e.target.closest && e.target.closest(".griph"); if(!g) return;
  const linha=g.closest(".lrow"), lista=g.closest(".ltable");
  if(!linha||!lista) return;
  e.preventDefault();
  arrasto={linha,lista};
  linha.classList.add("arrastando");
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener("pointermove",e=>{
  if(!arrasto) return;
  const {linha,lista}=arrasto, y=e.clientY;
  let antes=null;
  for(const ir of lista.querySelectorAll(".lrow")){
    if(ir===linha) continue;
    const r=ir.getBoundingClientRect();
    if(y < r.top + r.height/2){ antes=ir; break; }
  }
  if(antes){ if(antes!==linha.nextSibling) lista.insertBefore(linha,antes); }
  else if(lista.lastElementChild!==linha) lista.appendChild(linha);
});
function soltarArrasto(){
  if(!arrasto) return;
  const {linha,lista}=arrasto; arrasto=null;
  linha.classList.remove("arrastando");
  aplicarOrdem(lista.dataset.lista, idsDa(lista));
}
document.addEventListener("pointerup",soltarArrasto);
document.addEventListener("pointercancel",soltarArrasto);

/* ============================ roteiro e mapa ============================ */
/* Coordenadas: Open-Meteo Geocoding (sem chave). Depois de achadas, ficam gravadas
   na própria parada, então o mapa continua funcionando sem rede. */
const GEO_API="https://geocoding-api.open-meteo.com/v1/search";

async function geocodar(cidade,pais){
  if(!cidade||!String(cidade).trim()) throw new Error("informe a cidade");
  const url=GEO_API+"?count=10&language=pt&format=json&name="+encodeURIComponent(String(cidade).trim());
  const r=await fetch(url);
  if(!r.ok) throw new Error("busca indisponível");
  const d=await r.json();
  const lista=(d&&d.results)||[];
  if(!lista.length) throw new Error("não encontrei \""+cidade+"\"");
  let alvo=lista[0];
  if(pais&&String(pais).trim()){
    const q=nz(pais);
    const m=lista.find(x=>nz(x.country||"").indexOf(q)>=0 || nz(x.country_code||"")===q);
    if(m) alvo=m;
  }
  return {lat:alvo.latitude, lon:alvo.longitude, achado:alvo.name, pais:alvo.country||""};
}

async function localizarParadas(){
  const t=trip(); if(!t||state.geocodando) return;
  const faltam=(t.roteiro||[]).filter(r=>r.cidade&&!(isFinite(r.lat)&&isFinite(r.lon)));
  if(!faltam.length){ toast("Todas as paradas já estão localizadas"); return; }
  state.geocodando=true; renderMapaPainel();
  let ok=0, erros=[];
  for(const r of faltam){
    try{
      const g=await geocodar(r.cidade,r.pais);
      r.lat=g.lat; r.lon=g.lon; r.achado=g.achado;
      if(!r.pais&&g.pais) r.pais=g.pais;
      ok++;
    }catch(e){ r.erroGeo=String(e.message||e); erros.push(r.cidade); }
    await new Promise(f=>setTimeout(f,250));
  }
  state.geocodando=false; touch(t.id); render();
  toast(erros.length ? `${ok} localizadas · não achei: ${erros.join(", ")}` : `${ok} ${ok===1?"parada localizada":"paradas localizadas"}`);
}

let leafletP=null, mapaInst=null, camadas={marcadores:[],pernas:[]};
let apiMapa=null, motorMapa="";

/* ---------- Google Maps ----------
   Exige chave de API (não há versão sem chave). A chave fica no navegador e deve
   ser restringida por referenciador no Google Cloud Console, já que a página é pública.
   Carregamos com language=pt-BR&region=BR, que é o que traz os rótulos em português. */
const GKEY="rotag.gmapskey";
const CHAVE_PADRAO="AIzaSyDwiMDcYqclZk-NuWgBsBLBQewsl5FVcM8";
/* Sem nada gravado, usa a chave padrão do app. Gravar vazio desliga o Google
   e faz os mapas voltarem ao OpenStreetMap. */
function chaveGoogle(){
  try{
    const v=localStorage.getItem(GKEY);
    if(v===null) return CHAVE_PADRAO;
    return v.trim();
  }catch(e){ return CHAVE_PADRAO; }
}
function chavePropria(){ try{ return localStorage.getItem(GKEY)!==null; }catch(e){ return false; } }
function salvarChaveGoogle(v){ try{ localStorage.setItem(GKEY,(v||"").trim()); }catch(e){} }
function restaurarChavePadrao(){ try{ localStorage.removeItem(GKEY); }catch(e){} }

let googleP=null;
function carregarGoogle(){
  if(window.google && window.google.maps) return Promise.resolve(window.google.maps);
  const k=chaveGoogle();
  if(!k) return Promise.reject(new Error("sem chave do Google"));
  if(googleP) return googleP;
  googleP=new Promise((ok,nao)=>{
    const t=setTimeout(()=>nao(new Error("o Google Maps não respondeu")),12000);
    window.__rotaGmaps=()=>{ clearTimeout(t); ok(window.google.maps); };
    window.gm_authFailure=()=>{ clearTimeout(t); nao(new Error("chave do Google recusada")); };
    const sc=document.createElement("script");
    sc.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(k)+
           "&language=pt-BR&region=BR&loading=async&v=weekly&callback=__rotaGmaps";
    sc.async=true;
    sc.onerror=()=>{ clearTimeout(t); nao(new Error("não consegui carregar o Google Maps")); };
    document.head.appendChild(sc);
  });
  return googleP;
}

/* Adaptador: expõe o pedacinho da interface do Leaflet que o app usa, por cima do
   Google Maps. Assim toda a lógica de pernas, rótulos e rotas continua a mesma. */
function adaptadorGoogle(gm){
  const conv=ll=>Array.isArray(ll)?{lat:+ll[0],lng:+ll[1]}:{lat:+ll.lat,lng:+(ll.lng!=null?ll.lng:ll.lon)};

  function Mapa(el){
    this._m=new gm.Map(el,{center:{lat:0,lng:0},zoom:2,
      mapTypeControl:false,streetViewControl:false,fullscreenControl:false,
      clickableIcons:false,gestureHandling:"greedy"});
    this._c=new Set();
  }
  Mapa.prototype.remove=function(){ this._c.forEach(c=>c._off()); this._c.clear(); this._m=null; };
  Mapa.prototype.setView=function(ll,z){ this._m.setCenter(conv(ll)); this._m.setZoom(z); return this; };
  Mapa.prototype.hasLayer=function(c){ return this._c.has(c); };
  Mapa.prototype.addLayer=function(c){ if(!this._c.has(c)){ c._on(this._m); this._c.add(c);} return this; };
  Mapa.prototype.removeLayer=function(c){ if(this._c.has(c)){ c._off(); this._c.delete(c);} return this; };
  Mapa.prototype.fitBounds=function(b,o){
    const p=(o&&o.padding&&o.padding[0])||40, mx=o&&o.maxZoom;
    this._m.fitBounds(b._b,p);
    if(mx){ const m=this._m; gm.event.addListenerOnce(m,"idle",()=>{ if(m.getZoom()>mx) m.setZoom(mx); }); }
    return this;
  };

  function Limites(lista){ this._b=new gm.LatLngBounds(); (lista||[]).forEach(x=>this._b.extend(conv(x))); }
  Limites.prototype.isValid=function(){ return !this._b.isEmpty(); };

  function Marcador(ll,o){
    const ic=(o&&o.icon)||{};
    this._ll=conv(ll); this._letra=ic._letra||""; this._cor=ic._cor||"#14614a";
    this._title=(o&&o.title)||""; this._g=null; this._map=null;
    this._html=""; this._perm=false; this._tt=null; this._info=null;
  }
  Marcador.prototype._on=function(m){
    this._map=m;
    this._g=new gm.Marker({position:this._ll,map:m,title:this._title,
      icon:{path:gm.SymbolPath.CIRCLE,scale:13,fillColor:this._cor,fillOpacity:1,
            strokeColor:"#ffffff",strokeWeight:2},
      label:{text:this._letra||" ",color:"#ffffff",fontSize:"12px",fontWeight:"600"}});
    this._montarRotulo();
  };
  Marcador.prototype._off=function(){
    if(this._info) this._info.close();
    if(this._g) this._g.setMap(null);
    this._g=null; this._info=null;
  };
  Marcador.prototype.addTo=function(mapa){ mapa.addLayer(this); return this; };
  Marcador.prototype.getLatLng=function(){ return this._ll; };
  Marcador.prototype.getElement=function(){
    const s=this;
    return {classList:{toggle:(cls,on)=>{ if(cls==="apagado"&&s._g) s._g.setOpacity(on?0.3:1); }}};
  };
  Marcador.prototype.bindTooltip=function(html,o){
    this._html=html; this._perm=!!(o&&o.permanent);
    this._tt={getElement:()=>null};
    this._montarRotulo(); return this;
  };
  Marcador.prototype.unbindTooltip=function(){
    this._tt=null; if(this._info){ this._info.close(); this._info=null; } return this;
  };
  Marcador.prototype.getTooltip=function(){ return this._tt; };
  Marcador.prototype._montarRotulo=function(){
    if(!this._g||!this._html) return;
    const s=this;
    if(this._info) this._info.close();
    this._info=new gm.InfoWindow({content:'<div class="rotulo-g">'+this._html+'</div>',
                                  disableAutoPan:true});
    gm.event.clearListeners(this._g,"mouseover");
    gm.event.clearListeners(this._g,"mouseout");
    gm.event.clearListeners(this._g,"click");
    if(this._perm){ this._info.open({map:this._map,anchor:this._g}); }
    else{
      this._g.addListener("mouseover",()=>s._info.open({map:s._map,anchor:s._g}));
      this._g.addListener("mouseout",()=>s._info.close());
      this._g.addListener("click",()=>s._info.open({map:s._map,anchor:s._g}));
    }
  };

  function Linha(pts,o){
    o=o||{};
    this._p=(pts||[]).map(conv);
    this._o={strokeColor:o.color||"#14614a",strokeWeight:o.weight||3,
             strokeOpacity:o.opacity==null?1:o.opacity};
    if(o.dashArray){
      this._o.strokeOpacity=0;
      this._o.icons=[{icon:{path:"M 0,-1 0,1",strokeOpacity:1,strokeColor:o.color||"#14614a",scale:(o.weight||3)/2},
                      offset:"0",repeat:"14px"}];
    }
    this._g=null;
  }
  Linha.prototype._on=function(m){ this._g=new gm.Polyline(Object.assign({path:this._p,map:m},this._o)); };
  Linha.prototype._off=function(){ if(this._g){ this._g.setMap(null); this._g=null; } };
  Linha.prototype.addTo=function(mapa){ mapa.addLayer(this); return this; };
  Linha.prototype.setStyle=function(st){
    if(st.color){ this._o.strokeColor=st.color;
      if(this._o.icons) this._o.icons[0].icon.strokeColor=st.color; }
    if(st.weight) this._o.strokeWeight=st.weight;
    if(this._g) this._g.setOptions(this._o);
    return this;
  };

  return {
    _google:true,
    map:(el)=>new Mapa(el),
    tileLayer:()=>({on:()=>{},off:()=>{},addTo:()=>{}}),   /* o Google traz o próprio fundo */
    divIcon:(o)=>o,
    marker:(ll,o)=>new Marcador(ll,o),
    polyline:(p,o)=>new Linha(p,o),
    latLngBounds:(l)=>new Limites(l)
  };
}

/* Escolhe o motor: Google se houver chave, Leaflet caso contrário ou se o Google falhar. */
async function carregarMotorMapa(){
  state.erroMapa="";
  if(chaveGoogle()){
    try{
      const gm=await carregarGoogle();
      apiMapa=adaptadorGoogle(gm); motorMapa="google";
      pintarMotor(); return apiMapa;
    }catch(e){
      state.erroMapa=String(e.message||e);
      toast(state.erroMapa+" — usando o OpenStreetMap");
    }
  }else{
    state.erroMapa="nenhuma chave do Google configurada";
  }
  const L=await carregarLeaflet();
  apiMapa=L; motorMapa="leaflet";
  pintarMotor();
  return apiMapa;
}
/* Mostra qual fundo está no ar. Sem isso, uma falha do Google passa por
   "Google sem português", quando na verdade é o OpenStreetMap no lugar dele. */
function pintarMotor(){
  const el=document.getElementById("motorinfo");
  if(!el) return;
  if(motorMapa==="google"){
    el.className="motorinfo ok";
    el.innerHTML="Fundo: <b>Google Maps</b> · pt-BR";
  }else{
    el.className="motorinfo alerta";
    el.innerHTML="Fundo: <b>OpenStreetMap</b>"+(state.erroMapa?" — "+esc(state.erroMapa):"")+
      "<span>Nomes no idioma local. Causas comuns: faturamento desativado no projeto, "+
      "Maps JavaScript API não habilitada, ou restrição de referenciador sem o domínio do site.</span>";
  }
}

function carregarLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(leafletP) return leafletP;
  leafletP=new Promise((ok,nao)=>{
    const css=document.createElement("link");
    css.rel="stylesheet";
    css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";
    sc.onload=()=>window.L?ok(window.L):nao(new Error("mapa não carregou"));
    sc.onerror=()=>nao(new Error("não consegui carregar a biblioteca do mapa"));
    document.head.appendChild(sc);
  });
  return leafletP;
}

const LETRA=i=>i<26?String.fromCharCode(65+i):String(i+1);
function paradasLocalizadas(t){
  return (t.roteiro||[]).filter(r=>isFinite(r.lat)&&isFinite(r.lon));
}

async function abrirMapa(){
  const t=trip(); if(!t) return;
  if(!paradasLocalizadas(t).length){ toast("Localize ao menos uma parada antes de abrir o mapa"); return; }
  state.modal="mapa"; state.perna="todas"; renderModal();
  let L;
  try{ L=await carregarMotorMapa(); }
  catch(e){
    const alvo=document.getElementById("mapa");
    if(alvo) alvo.innerHTML=`<div class="mapfail"><p>${esc(String(e.message||e))}.</p>
      <p>O mapa precisa de conexão. A sequência da viagem continua listada ao lado.</p></div>`;
    return;
  }
  montarMapa(L);
}

function montarMapa(L){
  const t=trip(), alvo=document.getElementById("mapa");
  if(!t||!alvo) return;
  const pts=paradasLocalizadas(t);
  if(mapaInst){ mapaInst.remove(); mapaInst=null; }
  camadas={marcadores:[],pernas:[]};

  mapaInst=L.map(alvo,{zoomControl:true,attributionControl:true,scrollWheelZoom:true});
  ligarTiles(L,0);

  pts.forEach((r,i)=>{
    const ic=L.divIcon({className:"",html:`<span class="pin"><b>${LETRA(i)}</b></span>`,
      iconSize:[30,30],iconAnchor:[15,15],_letra:LETRA(i),_cor:"#14614a"});
    const m=L.marker([r.lat,r.lon],{icon:ic,title:r.cidade}).addTo(mapaInst);
    m._conteudo=`<b>${esc(r.cidade)}</b>${r.pais?`<i>${esc(r.pais)}</i>`:""}${periodoParada(r)?`<i>${esc(periodoParada(r))}</i>`:""}`;
    camadas.marcadores.push(m);
  });

  for(let i=0;i<pts.length-1;i++){
    const a=[pts[i].lat,pts[i].lon], b=[pts[i+1].lat,pts[i+1].lon];
    const base=L.polyline([a,b],{color:"#ffffff",weight:7,opacity:.9});
    const linha=L.polyline([a,b],{color:"#14614a",weight:3.5,opacity:.95});
    camadas.pernas.push({base,linha,a,b});
  }
  aplicarRotulos();
}

/* Provedores de mapa que não pedem chave. Se um falhar, o próximo entra sozinho.
   O "claro" do primeiro vem de um filtro CSS aplicado só aos tiles, para as linhas
   da viagem continuarem vivas por cima. */
const TILES=[
  { nome:"osm", clarear:true,
    url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    opts:{maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'} },
  { nome:"esri", clarear:false,
    url:"https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
    opts:{maxZoom:16, attribution:'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'} },
  { nome:"osmfr", clarear:true,
    url:"https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",
    opts:{maxZoom:18, subdomains:"abc", attribution:'&copy; OpenStreetMap France, &copy; OpenStreetMap'} }
];
function ligarTiles(L,i){
  const alvo=document.getElementById("mapa");
  if(L&&L._google){ if(alvo) alvo.classList.remove("clarear","semtiles"); return; }
  if(i>=TILES.length){
    if(alvo) alvo.classList.add("semtiles");
    return;
  }
  const cfg=TILES[i];
  if(alvo) alvo.classList.toggle("clarear", !!cfg.clarear);
  const camada=L.tileLayer(cfg.url,cfg.opts);
  let carregou=false, erros=0;
  camada.on("tileload",()=>{ carregou=true; });
  camada.on("tileerror",()=>{
    erros++;
    if(!carregou && erros>=4){
      camada.off();
      if(mapaInst && mapaInst.hasLayer(camada)) mapaInst.removeLayer(camada);
      ligarTiles(L,i+1);
    }
  });
  camada.addTo(mapaInst);
}

/* Por padrão o nome só aparece ao passar o mouse (ou tocar no pino).
   O interruptor no painel deixa todos fixos, para conferir o traçado inteiro. */
function aplicarRotulos(){
  const fixos=!!state.rotulosFixos;
  camadas.marcadores.forEach(m=>{
    if(m.getTooltip && m.getTooltip()) m.unbindTooltip();
    m.bindTooltip(m._conteudo,{
      permanent:fixos,
      direction:fixos?"right":"top",
      offset:fixos?[15,0]:[0,-17],
      className:"rotulo"+(fixos?" fixo":""),
      opacity:1
    });
  });
  aplicarPerna();
}

function aplicarPerna(){
  if(!mapaInst||!apiMapa) return;
  const L=apiMapa, sel=state.perna;
  camadas.pernas.forEach((p,i)=>{
    const mostrar = sel==="todas" || sel===i;
    [p.base,p.linha].forEach(l=>{ if(mostrar) l.addTo(mapaInst); else if(mapaInst.hasLayer(l)) mapaInst.removeLayer(l); });
    if(mostrar) p.linha.setStyle({color: sel===i ? "#a85b3c" : "#14614a", weight: sel===i ? 4.5 : 3.5});
  });
  camadas.marcadores.forEach((m,i)=>{
    const apagado = typeof sel==="number" && i!==sel && i!==sel+1;
    const el=m.getElement(); if(el) el.classList.toggle("apagado",apagado);
    const tt=m.getTooltip && m.getTooltip();
    const te=tt && tt.getElement && tt.getElement();
    if(te) te.classList.toggle("apagado",apagado);
  });
  let alvo=null;
  if(typeof sel==="number" && camadas.pernas[sel]) alvo=L.latLngBounds([camadas.pernas[sel].a,camadas.pernas[sel].b]);
  else if(camadas.marcadores.length) alvo=L.latLngBounds(camadas.marcadores.map(m=>m.getLatLng()));
  if(alvo&&alvo.isValid()) mapaInst.fitBounds(alvo,{padding:[70,70],maxZoom:11});
  const p=document.getElementById("mapseq");
  if(p) p.querySelectorAll("[data-perna]").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.perna===String(sel))));
}

function periodoParada(r){
  if(r.chegada&&r.saida) return dataBR(r.chegada)+" – "+dataBR(r.saida);
  if(r.chegada) return "a partir de "+dataBR(r.chegada);
  if(r.saida) return "até "+dataBR(r.saida);
  return "";
}

/* ============================ cotação de turismo ============================ */
/* Fonte: AwesomeAPI (economia.awesomeapi.com.br). Turismo existe só para USD e EUR
   (pares USD-BRLT / EUR-BRLT). Para as demais moedas usamos a cotação comercial e
   aplicamos o spread de turismo observado no dólar no mesmo momento. Usamos o preço
   de venda (ask) — é o que a casa de câmbio cobra de quem compra. */
const CAMBIO_API="https://economia.awesomeapi.com.br/json/last/";
const TEM_TURISMO=["USD","EUR"];

async function apiCotacao(pares){
  const r=await fetch(CAMBIO_API+encodeURIComponent(pares),{cache:"no-store"});
  if(!r.ok) throw new Error("fonte respondeu "+r.status);
  const d=await r.json();
  if(d && d.status && +d.status!==200) throw new Error(d.message||"moeda não encontrada");
  return d;
}
const achaPar=(d,moeda,codein)=>Object.values(d||{})
  .find(x=>x&&x.code===moeda&&(!codein||x.codein===codein));
function preco(x){
  const a=parseFloat(x&&x.ask), b=parseFloat(x&&x.bid);
  if(isFinite(a)&&a>0) return a;
  if(isFinite(b)&&b>0) return b;
  return 0;
}
async function buscarCotacao(moeda){
  /* spread de turismo do dólar, para reaproveitar nas moedas sem cotação de turismo */
  let spread=null;
  try{
    const d=await apiCotacao("USD-BRL,USD-BRLT");
    const com=preco(achaPar(d,"USD","BRL")), tur=preco(achaPar(d,"USD","BRLT"));
    if(com>0&&tur>0) spread=tur/com;
  }catch(e){}

  if(TEM_TURISMO.indexOf(moeda)>=0){
    const d=await apiCotacao(moeda+"-BRLT");
    const tur=preco(achaPar(d,moeda,"BRLT"));
    if(!tur) throw new Error("a fonte não devolveu a cotação de turismo");
    let com=0;
    try{ com=preco(achaPar(await apiCotacao(moeda+"-BRL"),moeda,"BRL")); }catch(e){}
    return {moeda,turismo:tur,comercial:com,fonte:"turismo",
            spread:com?tur/com:spread,quando:new Date()};
  }

  const d=await apiCotacao(moeda+"-BRL");
  const com=preco(achaPar(d,moeda,"BRL"));
  if(!com) throw new Error("a fonte não cobre "+moeda);
  return {moeda,turismo:spread?com*spread:com,comercial:com,
          fonte:spread?"comercial+spread":"comercial",spread,quando:new Date()};
}
/* Cada fonte de dinheiro tem sua moeda e sua cotação. Real vale 1; a moeda da
   viagem usa o câmbio da viagem; as demais são buscadas ou digitadas à mão. */
function taxaPadrao(t,moeda){
  if(!moeda||moeda==="BRL") return 1;
  if(moeda===t.moeda) return num(t.cambio)||0;
  return num(t.taxas&&t.taxas[moeda])||0;
}
/* Busca a cotação assim que a moeda é escolhida e guarda na viagem,
   para as próximas linhas na mesma moeda já nascerem preenchidas. */
const buscandoTaxa={};
async function garantirTaxa(moeda){
  const t=trip();
  if(!t||!moeda||moeda==="BRL"||moeda===t.moeda) return;
  t.taxas=t.taxas||{};
  if(num(t.taxas[moeda])>0||buscandoTaxa[moeda]) return;
  buscandoTaxa[moeda]=true;
  try{
    const c=await buscarCotacao(moeda);
    const v=Math.round(c.turismo*10000)/10000;
    t.taxas[moeda]=v;
    (t.guardados||[]).forEach(g=>{ if(g.moeda===moeda && !num(g.taxa)) g.taxa=v; });
    touch(t.id); render();
    toast(moeda+" a R$ "+fmt(v,4)+(c.fonte==="turismo"?" (turismo)":" (comercial + spread)"));
  }catch(e){
    toast("Não achei a cotação de "+moeda+" — digite à mão");
  }finally{ buscandoTaxa[moeda]=false; }
}
function valorEmBRL(t,g){
  const tx=num(g.taxa)|| taxaPadrao(t,g.moeda);
  return num(g.valor)*tx;
}
function totalGuardado(t){
  return (t.guardados||[]).reduce((s,g)=>s+valorEmBRL(t,g),0);
}
/* Ao escolher a moeda numa fonte, a cotação é buscada na hora — sem esperar o botão. */
const taxasEmBusca={};
async function garantirTaxa(moeda){
  const t=trip();
  if(!t||!moeda||moeda==="BRL"||taxasEmBusca[moeda]) return;
  const alvo=()=> (t.guardados||[]).filter(g=>g.moeda===moeda && !num(g.taxa));
  if(!alvo().length) return;
  taxasEmBusca[moeda]=true;
  try{
    const c=await buscarCotacao(moeda);
    const tx=Math.round(c.turismo*10000)/10000;
    alvo().forEach(g=>{ g.taxa=tx; });
    touch(t.id); render();
    toast(moeda+" a R$ "+fmt(tx,4));
  }catch(e){
    toast("Não achei a cotação de "+moeda+" — digite à mão");
  }finally{ delete taxasEmBusca[moeda]; }
}

async function atualizarTaxasGuardadas(){
  const t=trip(); if(!t) return;
  const moedas=[...new Set((t.guardados||[]).map(g=>g.moeda).filter(m=>m&&m!=="BRL"))];
  if(!moedas.length){ toast("Nenhuma moeda estrangeira na lista"); return; }
  toast("Buscando cotações…");
  let ok=0, erros=[];
  for(const m of moedas){
    if(m===t.moeda){
      (t.guardados||[]).forEach(g=>{ if(g.moeda===m) g.taxa=num(t.cambio); });
      ok++; continue;
    }
    try{
      const c=await buscarCotacao(m);
      const v=Math.round(c.turismo*10000)/10000;
      t.taxas=t.taxas||{}; t.taxas[m]=v;
      (t.guardados||[]).forEach(g=>{ if(g.moeda===m) g.taxa=v; });
      ok++;
    }catch(e){ erros.push(m); }
  }
  touch(t.id); render();
  toast(erros.length? `${ok} atualizadas · sem cotação: ${erros.join(", ")}` : `${ok} ${ok===1?"cotação atualizada":"cotações atualizadas"}`);
}

function taxaComIOF(t,base){
  return base*(t.iofOn?1+num(t.iof)/100:1);
}
async function atualizarCotacao(aplicar){
  const t=trip(); if(!t||state.buscandoCotacao) return;
  state.buscandoCotacao=true; state.cotacao=null; renderCambio();
  try{
    const c=await buscarCotacao(t.moeda);
    state.cotacao=c;
    if(aplicar){
      t.cambio=Math.round(taxaComIOF(t,c.turismo)*10000)/10000;
      t.cambioFonte=c.fonte; t.cambioEm=c.quando.toISOString();
      touch(t.id);
    }
  }catch(e){
    state.cotacao={erro:String(e.message||e),moeda:t.moeda};
  }
  state.buscandoCotacao=false;
  render();
}

/* ============================ leitura de planilha .xlsx ============================ */
/* Reconhece o layout do modelo: blocos identificados pelos cabeçalhos, não por
   posição fixa, então linhas a mais ou a menos não quebram a leitura. */

let xlsxPromise=null;
function carregarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxPromise) return xlsxPromise;
  const urls=["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"];
  xlsxPromise=new Promise((ok,falha)=>{
    let i=0;
    (function tenta(){
      if(i>=urls.length){ falha(new Error("leitor indisponível")); return; }
      const sc=document.createElement("script");
      sc.src=urls[i++]; sc.async=true;
      sc.onload=()=>window.XLSX?ok(window.XLSX):tenta();
      sc.onerror=tenta;
      document.head.appendChild(sc);
    })();
  });
  return xlsxPromise;
}

const nz=v=>String(v==null?"":v).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
             .toLowerCase().trim().replace(/\s+/g," ");
const ehNum=v=>typeof v==="number" ? isFinite(v) : (typeof v==="string" && /\d/.test(v) && !/[a-z]/i.test(v));
const val=v=>typeof v==="number"?(isFinite(v)?v:0):num(v);
function data(v){
  if(v instanceof Date && !isNaN(v)){
    return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  }
  if(typeof v==="number" && v>20000 && v<80000){
    const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);
    return d.toISOString().slice(0,10);
  }
  if(typeof v==="string" && /^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
  return "";
}
function idxCol(lin,...alvos){
  for(const a of alvos){ const i=lin.findIndex(c=>c===a); if(i>=0) return i; }
  for(const a of alvos){ const i=lin.findIndex(c=>c&&c.includes(a)); if(i>=0) return i; }
  return -1;
}
function paxCabecalho(lin){
  for(const c of lin){ const m=/^x\s*(\d+)$/.exec(c||""); if(m) return +m[1]; }
  return 0;
}
function tituloAcima(g,i){
  for(let k=i-1;k>=Math.max(0,i-4);k--){
    const v=(g[k]||[])[0];
    if(v!=null && String(v).trim() && !ehNum(v)) return String(v).trim();
  }
  return "";
}
function linhasBloco(g,head){
  const out=[];
  for(let i=head+1;i<g.length && i<head+200;i++){
    const r=g[i]||[];
    if(nz(r[0])==="total") break;
    const vazia=r.every(c=>c==null||String(c).trim()==="");
    if(vazia){ if(out.length) break; else continue; }
    out.push(r);
  }
  return out;
}

const MOEDA_TXT=[["euro","EUR"],["dolar","USD"],["libra","GBP"],["iene","JPY"],
                 ["franco","CHF"],["lira","TRY"],["peso","ARS"]];

function viagemDoExcel(g,nomeArq){
  const avisos=[], resumo=[];
  const t=novaViagem({ano:new Date().getFullYear(),nome:"",moeda:"EUR",cambio:1,adultos:1});
  t.nome=(nomeArq||"Viagem importada").replace(/\.(xlsx|xlsm|xls)$/i,"").replace(/[_-]+/g," ").trim();

  /* moeda e câmbio */
  for(let i=0;i<g.length && i<120;i++){
    const r=g[i]||[];
    for(let j=0;j<r.length;j++){
      const c=nz(r[j]);
      if(!/^valor\s+/.test(c)) continue;
      const par=MOEDA_TXT.find(([k])=>c.includes(k));
      if(!par) continue;
      for(let k=j+1;k<Math.min(r.length,j+6);k++){
        if(ehNum(r[k]) && val(r[k])>0){ t.moeda=par[1]; t.cambio=val(r[k]); break; }
      }
      if(t.cambio>1) break;
    }
    if(t.cambio>1) break;
  }
  if(t.cambio<=1) avisos.push("Não achei a cotação na planilha — informe o câmbio depois de importar.");

  /* localiza os blocos pelos cabeçalhos */
  const blocos=[];
  for(let i=0;i<g.length;i++){
    const lin=(g[i]||[]).map(nz);
    const tem=(...w)=>w.every(x=>lin.some(c=>c&&c.includes(x)));
    let tipo=null;
    if(tem("trecho","valor individual")) tipo="trecho";
    else if(tem("check in","valor diaria")||tem("check-in","valor diaria")) tipo="hospedagem";
    else if(tem("valor almoco")||tem("total refeicao")) tipo="refeicao";
    else if(tem("valor atracoes")||tem("nr atracoes/dia")) tipo="atracoes";
    else if(tem("imas")||tem("chaveiros")) tipo="souvenir";
    if(tipo) blocos.push({tipo,head:i,lin,titulo:tituloAcima(g,i)});
  }
  if(!blocos.length) return null;

  let paxMax=0;
  const conf=(cat,calc,esperado,rotulo)=>{
    if(esperado==null||!isFinite(esperado)||esperado===0) return;
    if(Math.abs(calc-esperado)>0.02)
      avisos.push(`${cat}: "${rotulo}" deu ${brl(calc)} mas a planilha trazia ${brl(esperado)}.`);
  };

  for(const b of blocos){
    const L=b.lin, linhas=linhasBloco(g,b.head);
    const pax=paxCabecalho(L); if(pax>paxMax) paxMax=pax;

    if(b.tipo==="trecho"){
      const ehPass=/passag/.test(nz(b.titulo));
      const cT=idxCol(L,"trecho"), cE=idxCol(L,"empresa"),
            cV=idxCol(L,"valor individual"), cX=L.findIndex(c=>/^x\s*\d+$/.test(c||""));
      for(const r of linhas){
        const bruto=cV>=0?r[cV]:null;
        const valor=ehNum(bruto)?val(bruto):0;
        let empresa=(cE>=0&&r[cE]!=null)?String(r[cE]):"";
        if(bruto!=null&&!ehNum(bruto)) empresa=(empresa?empresa+" · ":"")+String(bruto);
        const nome=(cT>=0&&r[cT]!=null)?String(r[cT]).trim():"";
        if(!nome&&!valor&&!empresa) continue;
        if(cX>=0&&ehNum(r[cX])) conf(ehPass?"Passagens":"Diversos", valor*(pax||1), val(r[cX]), nome||b.titulo);
        if(ehPass){
          const q=partirRota(nome);
          t.passagens.push({id:uid(),de:q.de,para:q.para,trecho:rotaTexto(q)||nome,
                            empresa,data:"",valor,pax:null,cur:"BRL"});
        }
        else t.diversos.push({id:uid(),item:b.titulo||"Diversos",obs:[nome,empresa].filter(Boolean).join(" · "),
                              qtd:1,valor,pax:null,cur:"BRL"});
      }
    }

    else if(b.tipo==="hospedagem"){
      const cL=idxCol(L,"local"), cI=idxCol(L,"check in","check-in"), cO=idxCol(L,"check out","check-out"),
            cD=idxCol(L,"dias"), cV=idxCol(L,"valor diaria"), cT=idxCol(L,"valor hotel");
      for(const r of linhas){
        const diaria=cV>=0?val(r[cV]):0;
        const ci=cI>=0?data(r[cI]):"", co=cO>=0?data(r[cO]):"";
        let dias=cD>=0?val(r[cD]):0;
        if(!dias&&ci&&co) dias=Math.max(0,Math.round((new Date(co+"T12:00")-new Date(ci+"T12:00"))/86400000));
        if(!diaria&&!dias) continue;
        if(cT>=0&&ehNum(r[cT])) conf("Hospedagem",diaria*dias,val(r[cT]),(cL>=0?String(r[cL]||""):"")||"linha");
        t.hospedagem.push({id:uid(),local:(cL>=0&&r[cL]!=null)?String(r[cL]):"Hospedagem",
                           checkin:ci,checkout:co,dias,diaria,qtd:1,cur:"BRL"});
      }
    }

    else if(b.tipo==="refeicao"){
      const cD=idxCol(L,"dias"), cA=idxCol(L,"valor almoco"), cJ=idxCol(L,"valor janta","valor jantar"),
            cT=idxCol(L,"total refeicao");
      for(const r of linhas){
        const dias=cD>=0?val(r[cD]):0; if(!dias) continue;
        const p=paxMax||1;
        const alm=cA>=0?val(r[cA]):0, jan=cJ>=0?val(r[cJ]):0;
        if(cT>=0&&ehNum(r[cT])) conf("Comida",(alm+jan)*dias,val(r[cT]),"refeições");
        if(alm) t.comida.push({id:uid(),item:"Almoço",dias,valor:alm/p,pax:null,cur:"BRL"});
        if(jan) t.comida.push({id:uid(),item:"Jantar",dias,valor:jan/p,pax:null,cur:"BRL"});
      }
      if(cA>=0) avisos.push("Comida: os valores de almoço e janta da planilha foram lidos como gasto do grupo e divididos pelas pessoas. Se já eram por pessoa, ajuste a coluna.");
    }

    else if(b.tipo==="atracoes"){
      const cL=idxCol(L,"local"), cD=idxCol(L,"dias"), cN=idxCol(L,"nr atracoes/dia","atracoes/dia"),
            cV=idxCol(L,"valor atracoes"), cX=L.findIndex(c=>/^x\s*\d+$/.test(c||""));
      for(const r of linhas){
        const dias=cD>=0?val(r[cD]):0, porDia=cN>=0?val(r[cN]):0, valor=cV>=0?val(r[cV]):0;
        if(!valor&&!dias) continue;
        if(cX>=0&&ehNum(r[cX])) conf("Atrações",valor*porDia*dias*(pax||1),val(r[cX]),(cL>=0?String(r[cL]||""):"")||"linha");
        t.atracoes.push({id:uid(),local:(cL>=0&&r[cL]!=null)?String(r[cL]):"Atrações",
                         dias,porDia,valor,pax:null,cur:"BRL"});
      }
    }

    else if(b.tipo==="souvenir"){
      /* os preços unitários vêm no título, ex.: "Lembranças - Eur ima 5 / chaveiro 5 / outros 10" */
      const precos=(String(b.titulo).match(/\d+(?:[.,]\d+)?/g)||[]).map(num);
      const cols=[];
      for(let j=1;j<L.length;j++) if(L[j]) cols.push({j,rotulo:String((g[b.head]||[])[j]||L[j]).trim()});
      if(!precos.length) avisos.push("Souvenir: não achei os preços unitários no título do bloco — preencha depois.");
      for(const r of linhasBloco(g,b.head)){
        const local=r[0]!=null?String(r[0]).trim():"";
        cols.forEach((c,k)=>{
          const qtd=val(r[c.j]); if(!qtd) return;
          t.souvenir.push({id:uid(),item:c.rotulo.charAt(0).toUpperCase()+c.rotulo.slice(1),
                           local,qtd,valor:precos[k]!=null?precos[k]:0,cur:"FX"});
        });
      }
    }
  }

  /* pessoas */
  t.adultos=paxMax||1; t.criancas=0;

  /* datas a partir do que foi lido */
  const datas=[];
  t.hospedagem.forEach(h=>{ if(h.checkin)datas.push(h.checkin); if(h.checkout)datas.push(h.checkout); });
  t.passagens.forEach(p=>{ if(p.data)datas.push(p.data); });
  if(datas.length){ datas.sort(); t.inicio=datas[0]; t.fim=datas[datas.length-1]; t.ano=+t.inicio.slice(0,4); }
  else avisos.push("Não achei datas na planilha — preencha início e fim depois de importar.");

  /* roteiro: primeira linha longa de texto da coluna A */
  for(let i=0;i<Math.min(g.length,12);i++){
    const v=(g[i]||[])[0];
    if(typeof v==="string" && v.length>40){ t.destino=v.trim(); break; }
  }

  /* reserva: o modelo trata como teto de orçamento */
  const parcial=compute(t);
  let reservaBRL=null;
  for(let i=0;i<g.length;i++){
    const r=g[i]||[];
    for(let j=0;j<r.length;j++){
      if(nz(r[j])!=="reserva") continue;
      for(let k=j+1;k<Math.min(r.length,j+3);k++) if(ehNum(r[k])&&val(r[k])>0){ reservaBRL=val(r[k]); break; }
      if(reservaBRL!=null) break;
    }
    if(reservaBRL!=null) break;
  }
  if(reservaBRL!=null && t.cambio>0){
    /* a planilha calcula a reserva como sobra do teto; aqui ela vira um valor fixo,
       e o teto fica guardado só para avisar se a viagem passar dele */
    t.reserva=reservaBRL/t.cambio; t.reservaCur="FX";
    t.meta=(parcial.sub+reservaBRL)/t.cambio; t.metaCur="FX";
  }else{
    t.reserva=0; t.reservaCur="BRL"; t.meta=0;
  }
  t.reservaFixaV2=true;

  const c=compute(t);
  for(const cat of CATS) if((t[cat.key]||[]).length)
    resumo.push({nome:cat.nome,linhas:t[cat.key].length,total:c.cats[cat.key]});
  return {trip:t,resumo,avisos,calc:c};
}

/* ============================ exportar / importar ============================ */
async function exportar(){
  const data=JSON.stringify({app:"rota",v:2,exportado:new Date().toISOString(),trips:state.trips},null,2);
  let dl=null;
  try{ dl = window.claude&&claude.use ? await claude.use("downloads") : null; }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename:"rota-viagens.json",data}); toast("Arquivo salvo"); return; }catch(e){}
  }
  try{
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="rota-viagens-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast("Backup baixado"); return;
  }catch(e){}
  try{ await navigator.clipboard.writeText(data); toast("Dados copiados para a área de transferência"); }
  catch(e){ toast("Não foi possível exportar aqui"); }
}
function importar(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,.xlsx,.xlsm,.xls";
  inp.onchange=async ()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    if(/\.(xlsx|xlsm|xls)$/i.test(f.name)) await importarExcel(f);
    else importarJSON(f);
  };
  inp.click();
}
function importarJSON(f){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(fr.result);
      const arr=Array.isArray(o)?o:o.trips;
      if(!Array.isArray(arr)) throw 0;
      const ids=new Set(state.trips.map(t=>t.id));
      let n=0;
      for(const t of arr){ if(!t||!t.id) continue; if(ids.has(t.id)) t.id=uid(); state.trips.push(migrarViagem(t)); touch(t.id); n++; }
      render(); toast(n+" "+(n===1?"viagem importada":"viagens importadas"));
    }catch(err){ toast("Arquivo não reconhecido"); }
  };
  fr.readAsText(f);
}
async function importarExcel(f){
  toast("Lendo a planilha…");
  let X;
  try{ X=await carregarXLSX(); }
  catch(e){ toast("Não consegui carregar o leitor de planilhas — verifique a conexão"); return; }
  try{
    const buf=await f.arrayBuffer();
    const wb=X.read(new Uint8Array(buf),{type:"array",cellDates:true});
    let melhor=null;
    for(const nome of wb.SheetNames){
      const g=X.utils.sheet_to_json(wb.Sheets[nome],{header:1,raw:true,defval:null,blankrows:true});
      const r=viagemDoExcel(g,f.name);
      if(r && (!melhor || r.resumo.length>melhor.resumo.length)) melhor=r;
    }
    if(!melhor||!melhor.resumo.length){ toast("Não reconheci o formato desta planilha"); return; }
    state.importado=melhor; state.modal="importar"; renderModal();
  }catch(e){ console.error(e); toast("Não consegui ler a planilha"); }
}

/* ============================ boot ============================ */
function saveUi(){ try{ localStorage.setItem(LSY,JSON.stringify({ano:state.ano,tripId:state.tripId,view:state.view})); }catch(e){} }
(function boot(){
  try{ const th=localStorage.getItem("rotag.theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
  const local=loadLocal();
  state.trips = (local&&local.length) ? local : [];
  migrarTodas();
  try{
    const ui=JSON.parse(localStorage.getItem(LSY)||"null");
    if(ui&&ui.ano) state.ano=ui.ano;
  }catch(e){}
  if(!state.trips.some(t=>t.ano===state.ano)){
    const anos=state.trips.map(t=>t.ano).sort();
    if(anos.length) state.ano=anos[0];
  }
  render();
  initStore();
  window.addEventListener("beforeunload",()=>{ if(dirty.size) flush(); });
})();
</script>
