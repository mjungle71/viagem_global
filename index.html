<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota — planejador de viagens</title>
<meta name="description" content="Planejador de viagens por ano: passagens, hospedagem, comida, atrações, souvenir, diversos e reserva, com conversão de moeda.">
<meta name="theme-color" content="#14614a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1613" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rota">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314614a'/%3E%3Cpath d='M16 5.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21zm0 2.6a7.9 7.9 0 1 1 0 15.8 7.9 7.9 0 0 1 0-15.8z' fill='%23eef0ea'/%3E%3Cpath d='M21.2 10.8l-7.1 3.3-3.3 7.1 7.1-3.3z' fill='%23eef0ea'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16241f;
  --ink-2:#4a5d56;
  --ink-3:#7b8c85;
  --paper:#eef0ea;
  --panel:#ffffff;
  --panel-2:#f7f8f4;
  --rule:rgba(22,36,31,.14);
  --rule-2:rgba(22,36,31,.07);
  --green:#14614a;
  --green-2:#2e8f6f;
  --olive:#7fa65c;
  --gold:#c08a2e;
  --clay:#a85b3c;
  --blue:#4a6fa5;
  --slate:#6b7b76;
  --rose:#9e3b3b;
  --focus:#14614a;
  --shadow:0 1px 2px rgba(22,36,31,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e3e9e4; --ink-2:#a3b1aa; --ink-3:#7e8d86;
    --paper:#0e1613; --panel:#16211d; --panel-2:#1b2723;
    --rule:rgba(227,233,228,.16); --rule-2:rgba(227,233,228,.08);
    --green:#4fb894; --green-2:#3d9d7c; --olive:#95bb70;
    --gold:#d6a34c; --clay:#c07a58; --blue:#7295c9; --slate:#8b9c96;
    --rose:#d17a7a; --focus:#4fb894;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .tripcard:hover{box-shadow:none}
}
:root[data-theme="dark"] .tripcard:hover{box-shadow:none}
:root[data-theme="dark"]{
  --ink:#e3e9e4; --ink-2:#a3b1aa; --ink-3:#7e8d86;
  --paper:#0e1613; --panel:#16211d; --panel-2:#1b2723;
  --rule:rgba(227,233,228,.16); --rule-2:rgba(227,233,228,.08);
  --green:#4fb894; --green-2:#3d9d7c; --olive:#95bb70;
  --gold:#d6a34c; --clay:#c07a58; --blue:#7295c9; --slate:#8b9c96;
  --rose:#d17a7a; --focus:#4fb894;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
input,select,button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:"Newsreader",Georgia,serif;font-weight:500;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.masthead{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.mast-in{max-width:1420px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand b{font-family:"Newsreader",serif;font-weight:600;font-size:25px;letter-spacing:-.02em}
.brand span{color:var(--ink-3);font-size:13px}
.iconbtn{
  background:none;border:1px solid var(--rule);border-radius:999px;
  width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2);
}
.iconbtn:hover{border-color:var(--green);color:var(--green)}

/* year rail */
.years{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.years::-webkit-scrollbar{display:none}
.yr{
  border:0;background:none;padding:6px 13px 8px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;font-size:15px;border-bottom:2px solid transparent;
  white-space:nowrap;
}
.yr:hover{color:var(--ink)}
.yr[aria-current="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}
.yr small{display:block;font-size:10.5px;font-weight:400;color:var(--ink-3);letter-spacing:.02em}

main{max-width:1420px;margin:0 auto;padding:26px 20px 90px}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--rule);background:var(--panel);border-radius:7px;
  padding:8px 14px;font-size:14px;font-weight:500;color:var(--ink);
}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:none}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger:hover{border-color:var(--rose);color:var(--rose)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ---------- year view ---------- */
.yearhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.yearhead h1{font-size:34px}
.yearhead .sum{color:var(--ink-2);font-size:14px;margin-top:3px}
.yearhead .sum b{color:var(--ink);font-weight:600}

.triplist{display:flex;flex-direction:column;gap:14px}
.tripcard{
  border:1px solid var(--ink);border-radius:10px;padding:20px 22px 22px;
  display:grid;grid-template-columns:1fr auto;gap:4px 22px;align-items:start;
  cursor:pointer;background:none;text-align:left;width:100%;
  transition:background .12s, box-shadow .12s;
}
.tripcard:hover{background:var(--panel-2);box-shadow:0 2px 10px rgba(22,36,31,.08)}
.tripcard:hover .tname{color:var(--green)}
.tname{font-family:"Newsreader",serif;font-size:24px;font-weight:500;transition:color .12s}
.tmeta{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.tmoney{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tmoney b{font-size:19px;font-weight:600;display:block}
.tmoney span{color:var(--ink-3);font-size:13px}
.bandwrap{grid-column:1/-1;margin-top:14px}

/* the segmented cost band — the one loud element */
.band{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--rule-2)}
.band i{display:block;height:100%}
.bandkey{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:9px;font-size:12px;color:var(--ink-2)}
.bandkey span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:2px;flex:none}

.catlist{display:flex;flex-direction:column}
.catitem{border-top:1px solid var(--rule)}
.catitem:last-child{border-bottom:1px solid var(--rule)}
.catrow{
  display:grid;grid-template-columns:10px 1fr auto 16px;gap:0 14px;align-items:center;
  width:100%;text-align:left;background:none;border:0;padding:17px 2px;cursor:pointer;
}
.catrow:hover{background:var(--panel-2)}
.catrow:hover .cname{color:var(--green)}
.catrow .dot{width:10px;height:10px;border-radius:3px}
.cwrap{display:block;min-width:0}
.cname{display:block;font-family:"Newsreader",serif;font-size:19px;font-weight:500;transition:color .12s}
.cmeta{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.cmoney{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmoney b{display:block;font-size:16px;font-weight:600}
.cmoney span{display:block;font-size:12px;color:var(--ink-3)}
.chev{color:var(--ink-3);transition:transform .22s ease;flex:none}
.catitem.aberto .chev{transform:rotate(180deg)}
.catitem.aberto .cname{color:var(--green)}
.catbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.catbody>div{overflow:hidden}
.catitem.aberto .catbody{grid-template-rows:1fr}
.catbody .sec{margin:0 0 4px}
.catbody .reserva{margin-bottom:14px}
.empty{
  border:1px dashed var(--rule);border-radius:10px;padding:44px 24px;text-align:center;color:var(--ink-2);
}
.empty h2{font-size:22px;margin-bottom:6px}
.empty p{margin:0 0 18px;font-size:14px}

/* ---------- trip view ---------- */
.crumb{background:none;border:0;color:var(--ink-3);font-size:13.5px;padding:0;margin-bottom:14px}
.crumb:hover{color:var(--green)}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--ink-3)}
[contenteditable]:focus{outline:2px solid var(--focus);outline-offset:3px;border-radius:3px}
.triphead{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:8px}
.triphead h1{font-size:32px}
.fields{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px 16px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 0;margin:16px 0 0;
}
.f label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.f input,.f select{
  width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:7px 9px;font-size:14px;font-variant-numeric:tabular-nums;
}
.f input:focus,.f select:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 14%,transparent)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px;align-items:start;margin-top:26px}
.layout>.catlist{min-width:0}

/* ledger sections */
.sec{margin-bottom:34px}
.sechead{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:7px;margin-bottom:2px}
.sechead h2{font-size:20px;margin-right:auto}
.sechead .st{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.sechead .sf{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:13px}

.ltable{width:100%}
.lhead,.lrow{display:grid;gap:8px;align-items:center;padding:7px 0}
.lhead{font-size:11.5px;color:var(--ink-3);border-bottom:1px solid var(--rule-2);padding-top:4px}
.lrow{border-bottom:1px solid var(--rule-2)}
.lrow:hover{background:var(--panel-2)}
.lrow input{
  width:100%;background:none;border:0;border-bottom:1px solid transparent;padding:5px 2px;
  font-size:14px;font-variant-numeric:tabular-nums;border-radius:0;
}
.lrow input:hover{border-bottom-color:var(--rule)}
.lrow input:focus{outline:none;border-bottom-color:var(--green);background:var(--panel-2)}
.lrow input::placeholder{color:var(--ink-3);opacity:.7}
.ta-r{text-align:right}
.cell.grip,.cell.lupa{display:flex;align-items:center;justify-content:center}
.cell.lupa .griph{cursor:pointer;font-size:17px;letter-spacing:0}
.sheet.larga{width:min(760px,100%)}
.voolista{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:9px;overflow:hidden;margin-bottom:18px}
.vooitem{
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:4px 14px;
  align-items:center;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--rule-2);padding:11px 13px;cursor:pointer;
}
.voolista .vooitem:first-child{border-top:0}
.vooitem:hover{background:var(--panel-2)}
.voocia{font-size:13.5px;font-weight:600;line-height:1.3}
.voocia .tag{display:inline-block;font-style:normal;font-size:9.5px;font-weight:600;margin-left:6px;
  padding:1px 5px;border-radius:4px;background:var(--green);color:#fff;vertical-align:1px}
.vooesc{font-size:12px;color:var(--ink-2);line-height:1.35}
.vooesc .direto{color:var(--green)}
.voodur{grid-column:1/3;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.voopreco{grid-row:1/3;grid-column:3;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.voopreco b{display:block;font-size:16px;font-weight:600}
.voopreco i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3)}
.hotcfg{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 14px;
  padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--panel-2)}
.hotcfg label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.hotcfg input[type=number]{width:52px;background:var(--panel);border:1px solid var(--rule);
  border-radius:6px;padding:4px 7px;font-size:13px;text-align:center}
.hotcfg .hotpp{font-size:12px;color:var(--ink-3)}
.hotcfg .chk{margin-left:auto;cursor:pointer}
.hotlista{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:9px;
  overflow:hidden;margin-bottom:18px;max-height:52vh;overflow-y:auto}
.hotitem{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule-2);
  padding:10px 12px;cursor:pointer}
.hotlista .hotitem:first-child{border-top:0}
.hotitem:hover{background:var(--panel-2)}
.hotitem img,.hotitem .semfoto{width:62px;height:62px;border-radius:7px;object-fit:cover;
  background:var(--panel-2);display:block}
.hotmeio{min-width:0;display:flex;flex-direction:column;gap:3px}
.hotnome{font-size:13.5px;font-weight:600;line-height:1.3}
.hotnome .estr{font-style:normal;font-size:10px;color:var(--gold);letter-spacing:-1px}
.hotloc{font-size:11.5px;color:var(--ink-3)}
.hotsinais{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.hotsinais .nota{font-style:normal;font-weight:600;background:var(--green);color:#fff;
  border-radius:4px;padding:1px 5px;font-size:10.5px}
.hotsinais .qtd{font-style:normal;color:var(--ink-3)}
.hotsinais .tag{font-style:normal;font-size:9.5px;padding:1px 5px;border-radius:4px;
  border:1px solid var(--rule);color:var(--ink-3)}
.hotsinais .tag.verde{border-color:var(--green);color:var(--green)}
.hotsinais .tag.ouro{border-color:var(--gold);color:var(--gold)}
.hotpreco{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hotpreco b{display:block;font-size:16px;font-weight:600}
.hotpreco i{display:block;font-style:normal;font-size:10px;color:var(--ink-3)}
.hotpreco i.risco{text-decoration:line-through;opacity:.75}
.atrfaixas{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 11px}
.atrfaixas span{flex:1;min-width:120px;border:1px solid var(--rule);border-radius:8px;
  padding:7px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.atrfaixas i{display:block;font-style:normal;font-size:10px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.hotcfg input[type=text]{background:var(--panel);border:1px solid var(--rule);
  border-radius:6px;padding:5px 9px;font-size:13px}
@media (max-width:640px){
  .hotitem{grid-template-columns:48px minmax(0,1fr)}
  .hotitem img,.hotitem .semfoto{width:48px;height:48px}
  .hotpreco{grid-column:2;text-align:left;margin-top:4px}
  .hotcfg .chk{margin-left:0}
}
@media (max-width:640px){
  .vooitem{grid-template-columns:1fr}
  .voopreco{grid-row:auto;grid-column:1;text-align:left;margin-top:4px}
  .voodur{grid-column:1}
}
.griph{
  border:0;background:none;color:var(--ink-3);cursor:grab;padding:5px 3px;font-size:15px;
  line-height:1;border-radius:5px;touch-action:none;letter-spacing:-1px;
}
.griph:hover{color:var(--green);background:var(--rule-2)}
.griph:active{cursor:grabbing}
.lrow.arrastando{
  background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.18);
  position:relative;z-index:5;border-radius:7px;
}
.lrow.arrastando .griph{cursor:grabbing;color:var(--green)}
.rota{display:flex;align-items:center;gap:5px;min-width:0}
.rota input{min-width:0;flex:1 1 0}
.seta{color:var(--ink-3);flex:none;font-size:13px;line-height:1}
.rowtot{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;white-space:nowrap}
.rowtot small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px}
.cur{
  border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:1px 6px;
  font-size:11.5px;color:var(--ink-2);min-width:30px;
}
.cur:hover{border-color:var(--green);color:var(--green)}
.del{
  border:0;background:none;color:var(--ink-3);font-size:17px;line-height:1;padding:2px 5px;border-radius:5px;
  opacity:0;transition:opacity .12s;
}
.lrow:hover .del,.del:focus{opacity:1}
.del:hover{color:var(--rose);background:var(--rule-2)}
.addrow{
  border:0;background:none;color:var(--ink-3);font-size:13.5px;padding:9px 2px;margin-top:2px;
}
.addrow:hover{color:var(--green)}
.hint{font-size:12px;color:var(--ink-3);margin:6px 0 0}

/* reserva panel */
.reserva{border:1px solid var(--rule);border-radius:9px;padding:16px;background:var(--panel);display:grid;gap:12px}
.reserva .rrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.reserva p{margin:0;font-size:13px;color:var(--ink-2)}
.big{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
.neg{color:var(--rose)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}

/* aside */
aside{position:sticky;top:78px;display:grid;gap:18px}
.card{border:1px solid var(--rule);border-radius:9px;background:var(--panel);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:10px}
.tot{font-variant-numeric:tabular-nums}
.tot .grand{font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.tot .fx{color:var(--ink-2);font-size:15px;margin-top:1px}
.meter{height:5px;border-radius:3px;background:var(--rule-2);overflow:hidden;margin:14px 0 10px}
.meter>i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .25s ease}
.meter.estourou>i{background:var(--rose)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;border-top:1px solid var(--rule-2)}
.kv:first-of-type{border-top:0}
.kv span{color:var(--ink-2)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.sens{width:100%;font-size:13px;font-variant-numeric:tabular-nums;border-collapse:collapse}
.sens td{padding:4px 0;border-top:1px solid var(--rule-2)}
.sens td:last-child{text-align:right;font-weight:500}
.sens td.ta-r{text-align:right}
.sheet .sens td{padding:5px 0}
.sens tr.here td{color:var(--green);font-weight:600}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);margin-top:10px;cursor:pointer}
.chk input[type=checkbox]{accent-color:var(--green);width:15px;height:15px;flex:none;margin:0}
.iofin{width:46px;background:var(--panel-2);border:1px solid var(--rule);border-radius:5px;
  padding:2px 5px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.hint.neg{color:var(--rose)}

/* new-trip sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.5);display:grid;place-items:center;padding:20px;z-index:60}
.sheet{background:var(--panel);border-radius:12px;padding:24px;width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.sheet h2{font-size:23px;margin-bottom:4px}
.sheet .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 18px}
.sheet .fields{border:0;padding:0;margin:0 0 20px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end}
.span2{grid-column:1/-1}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.status{font-size:12px;color:var(--ink-3);padding-left:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status.neg{color:var(--rose)}


/* ---------- roteiro ---------- */
.mapacts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.planowrap{overflow-x:auto;border:1px solid var(--rule);border-radius:9px;background:var(--panel)}
.plano{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.plano th,.plano td{border-bottom:1px solid var(--rule-2);padding:0;text-align:right}
.plano thead th{
  font-size:10.5px;font-weight:500;color:var(--ink-3);padding:7px 6px;white-space:nowrap;
  border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);
}
.plano th.colcat{
  text-align:left;font-weight:500;font-size:12px;padding:6px 9px;white-space:nowrap;
  position:sticky;left:0;background:var(--panel);z-index:2;min-width:118px;
}
.plano th.colcat small{display:block;font-size:9.5px;font-weight:400;color:var(--ink-3);
  letter-spacing:.02em;margin-top:1px}
.plano th.colcat .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px}
.plano tbody td input{
  width:100%;min-width:58px;background:none;border:0;padding:6px 6px;text-align:right;
  font-size:12.5px;font-variant-numeric:tabular-nums;border-radius:0;color:var(--ink);
}
.plano tbody td input::placeholder{color:var(--ink-3);opacity:.5}
.plano tbody td input:hover{background:var(--panel-2)}
.plano tbody td input:focus{outline:none;background:var(--panel-2);box-shadow:inset 0 -2px 0 var(--green)}
.plano td.colfim,.plano th.colfim{padding:6px 9px;white-space:nowrap;font-size:12.5px}
.plano .colfim.ok{color:var(--green)}
.plano .colfim.neg{color:var(--rose)}
.plano tfoot td{padding:6px 6px;font-size:12.5px}
.plano tfoot .ftot th,.plano tfoot .ftot td{font-weight:600;border-top:1.5px solid var(--ink);border-bottom:0}
.plano tfoot .facum td,.plano tfoot .facum th{color:var(--ink-3);font-size:12px;border-bottom:1px solid var(--rule)}
.plano tfoot .fmoeda th,.plano tfoot .fmoeda td{background:color-mix(in srgb,var(--gold) 7%,transparent)}
/* azul = a parcela já está paga pelo dinheiro de hoje. Pinta a célula, não a coluna. */
.plano td.coberto{background:color-mix(in srgb,var(--blue) 15%,transparent)}
.plano td.coberto input{color:var(--blue);font-weight:600}
.aviso{margin:0 0 10px;font-size:12.5px;padding:8px 12px;border-radius:8px;line-height:1.45}
.aviso:empty{display:none}
.aviso.bom{background:color-mix(in srgb,var(--green) 10%,transparent);color:var(--green)}
.aviso.ruim{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--ink)}
.aviso.neutro{background:var(--panel-2);color:var(--ink-2)}
.aviso b{font-weight:600}
.plano .colfim.pouco{color:var(--gold)}
.previa{margin:0 0 18px;font-size:13px;color:var(--ink-2);background:var(--panel-2);
  border-radius:8px;padding:10px 12px;line-height:1.5}
.previa .dep{display:block;margin-top:3px;font-size:11.5px;color:var(--gold)}
.chip{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:2px}
.chip.coberto{background:color-mix(in srgb,var(--blue) 55%,transparent)}
.geo{font-size:12px;font-variant-numeric:tabular-nums}
.lrow select{width:100%;background:none;border:0;border-bottom:1px solid transparent;
  padding:4px 1px;font-size:13px;border-radius:0;color:var(--ink)}
.lrow select:hover{border-bottom-color:var(--rule)}
.lrow select:focus{outline:none;border-bottom-color:var(--green);background:var(--panel-2)}
.fixo1{display:block;text-align:right;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding:5px 2px}
.lrow input.faltando{border-bottom-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,transparent)}
.geo .ok{color:var(--green)}
.geo .neg{color:var(--rose)}

/* ---------- mapa em tela cheia ---------- */
.mapscrim{background:rgba(10,18,15,.62);padding:0}
.mapwrap{
  position:relative;width:75vw;height:75vh;border-radius:14px;overflow:hidden;
  background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.45);
}
#mapa{position:absolute;inset:0;background:var(--panel-2)}
#mapa.clarear .leaflet-tile-pane{filter:saturate(.2) contrast(.88) brightness(1.12)}
#mapa.semtiles::after{
  content:"Não consegui carregar as imagens do mapa. As paradas e as pernas continuam na lista ao lado.";
  position:absolute;inset:auto 16px 16px 16px;background:var(--panel);color:var(--ink-2);
  padding:10px 13px;border-radius:9px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:900;
}
.mapfail{display:grid;place-content:center;height:100%;padding:30px;text-align:center;color:var(--ink-2);gap:6px}
.mapfail p{margin:0;font-size:14px;max-width:44ch}
.mapclose{
  position:absolute;top:12px;left:12px;z-index:1200;width:34px;height:34px;border-radius:999px;
  border:0;background:var(--panel);color:var(--ink);font-size:20px;line-height:1;
  box-shadow:0 2px 10px rgba(0,0,0,.28);
}
.mapclose:hover{color:var(--rose)}

/* sequência, canto superior direito */
.mapseq{
  position:absolute;top:14px;right:14px;z-index:1200;width:270px;max-height:calc(100% - 28px);
  display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 94%,transparent);
  border-radius:11px;box-shadow:0 6px 26px rgba(0,0,0,.26);overflow:hidden;
  backdrop-filter:blur(8px);
}
.seqhead{padding:13px 14px 10px;border-bottom:1px solid var(--rule-2)}
.seqhead h3{font-size:15px;margin-bottom:9px}
.motorinfo{font-size:11px;line-height:1.35;margin:-4px 0 9px;padding:5px 8px;border-radius:6px}
.motorinfo:empty{display:none}
.motorinfo.ok{background:color-mix(in srgb,var(--green) 11%,transparent);color:var(--green)}
.motorinfo.alerta{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--ink)}
.motorinfo span{display:block;margin-top:3px;color:var(--ink-2);font-size:10.5px}
.seqbtns{display:flex;gap:6px}
.seqbtns button{
  flex:1;border:1px solid var(--rule);background:none;border-radius:6px;padding:5px 6px;
  font-size:12px;color:var(--ink-2);
}
.seqbtns button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.seqlista{overflow-y:auto;padding:8px 10px 12px}
.seqitem{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start;padding:6px 4px}
.seqbadge{
  width:24px;height:24px;border-radius:7px;background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:600;
}
.seqitem b{font-size:13.5px;font-weight:600;display:block;line-height:1.3}
.seqitem i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);line-height:1.35}
.seqperna{
  display:block;width:100%;text-align:left;margin:2px 0 2px 33px;padding:4px 8px;
  border:1px solid transparent;border-left:2px solid var(--rule);border-radius:0 6px 6px 0;
  background:none;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.seqperna span{display:block;font-size:10.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seqperna:hover{color:var(--green);border-left-color:var(--green)}
.seqperna[aria-pressed="true"]{
  background:var(--panel-2);color:var(--clay);border-left-color:var(--clay);font-weight:600;
}

/* pinos */
.pin{
  display:grid;place-items:center;width:30px;height:30px;border-radius:50% 50% 50% 4px;
  transform:rotate(-45deg);background:var(--green);box-shadow:0 2px 7px rgba(0,0,0,.35);
  border:2px solid #fff;transition:opacity .18s;
}
.pin b{transform:rotate(45deg);color:#fff;font-size:13px;font-weight:600;font-family:"IBM Plex Sans",sans-serif}
.leaflet-marker-icon.apagado .pin{opacity:.28}
.leaflet-container{font-family:"IBM Plex Sans",sans-serif}
.leaflet-tooltip{font-size:12px;border-radius:7px;border:0;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.leaflet-tooltip.rotulo{
  background:rgba(255,255,255,.94);color:#16241f;padding:4px 9px;border-radius:8px;
  border:1px solid rgba(22,36,31,.14);box-shadow:0 2px 9px rgba(0,0,0,.18);
  white-space:nowrap;line-height:1.28;transition:opacity .18s;
}
.leaflet-tooltip.rotulo.fixo::before{display:none}
.rotulo-g{font-family:"IBM Plex Sans",sans-serif;line-height:1.3;padding:1px 2px}
.rotulo-g b{display:block;font-size:13px;font-weight:600;color:#14614a}
.rotulo-g i{display:block;font-style:normal;font-size:11px;color:#5c6b65}
.gm-style-iw button.gm-ui-hover-effect{display:none !important}
.gm-style .gm-style-iw-c{padding:7px 11px !important;border-radius:9px}
.gm-style .gm-style-iw-d{overflow:hidden !important}
.leaflet-tooltip.rotulo.leaflet-tooltip-top::before{border-top-color:rgba(255,255,255,.94)}
.rotulo b{display:block;font-size:12.5px;font-weight:600;color:#14614a}
.rotulo i{display:block;font-style:normal;font-size:10.5px;color:#5c6b65}
.leaflet-tooltip.rotulo.apagado{opacity:.22}


/* ---------- turismo local ---------- */
.mapwrap.larga .mapseq{width:326px}
.campoloc{margin:0 0 12px;position:relative}
.campoloc label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.campoloc input,.campoloc select{
  width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:6px 8px;font-size:13px;
}
.campoloc input:focus,.campoloc select:focus{border-color:var(--green);outline:none}
.sugestoes{margin-top:4px}
.sugcarr{font-size:11.5px;color:var(--ink-3);padding:5px 4px}
.sugbloco{border:1px solid var(--rule);border-radius:8px;margin:0 0 12px;overflow:hidden}
.sugtop{
  display:flex;align-items:center;justify-content:space-between;padding:6px 9px;
  font-size:11.5px;color:var(--ink-3);background:var(--panel-2);border-bottom:1px solid var(--rule-2);
}
.sugtop button{border:0;background:none;color:var(--ink-3);font-size:15px;line-height:1;padding:0 3px}
.sugtop button:hover{color:var(--rose)}
.suglinha{
  display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;
  border-top:1px solid var(--rule-2);font-size:12.5px;color:var(--ink);
}
.sugestoes .suglinha:first-child{border-top:0}
.suglinha:hover:not(:disabled){background:var(--panel-2);color:var(--green)}
.suglinha:disabled{opacity:.45}
.suglinha span{display:block;line-height:1.3}
.suglinha i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptshead{font-size:11px;color:var(--ink-3);margin:10px 0 3px;padding-top:9px;border-top:1px solid var(--rule-2)}
.ptitem{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;padding:6px 0;
  border-top:1px solid var(--rule-2)}
.ptitem .seqbadge{margin-top:2px}
.ptcampos{display:block;min-width:0}
.ptcampos input{
  width:100%;background:none;border:0;border-bottom:1px solid transparent;padding:2px 1px;
  font-size:13px;font-weight:600;color:var(--ink);border-radius:0;
}
.ptcampos input:nth-child(2){font-size:11px;font-weight:400;color:var(--ink-3)}
.ptcampos input:hover{border-bottom-color:var(--rule)}
.ptcampos input:focus{outline:none;border-bottom-color:var(--green);background:var(--panel-2)}
.ptcampos i{display:block;font-style:normal;font-size:10.5px}
.ptacts{display:flex;gap:2px;align-items:center}
.ptacts button{border:0;background:none;color:var(--ink-3);font-size:14px;line-height:1;
  padding:2px 4px;border-radius:5px;opacity:.55}
.ptacts button:hover{opacity:1;background:var(--rule-2)}
.ptacts button[aria-pressed="true"]{color:var(--green);opacity:1}
.ptacts .del{position:static;opacity:.55;font-size:16px}
.ptacts .del:hover{color:var(--rose);opacity:1}
.ptitem.visitado .ptcampos input:first-child{color:var(--ink-3);text-decoration:line-through}
.ptitem.visitado .seqbadge{background:var(--ink-3)}
.pin.pinlocal.jafoi{background:var(--slate);opacity:.75}
.otimres{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule-2)}
.otimlista{margin:7px 0 9px;padding-left:20px;font-size:12.5px;line-height:1.55;color:var(--ink)}
.otimlista li{padding:1px 0}
.otimlista li::marker{color:var(--clay);font-weight:600}
.pin.pinlocal{background:var(--clay);width:28px;height:28px}
.pin.pinlocal b{font-size:12px}

@media (max-width:820px){
  .mapwrap{width:96vw;height:88vh}
  .mapwrap.larga .mapseq{width:auto}
  .mapseq{width:auto;left:14px;right:14px;top:auto;bottom:14px;max-height:44%}
  .mapclose{top:auto;bottom:calc(44% + 24px);left:14px}
}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:26px}
  aside{position:static;order:-1}
}
@media (max-width:700px){
  main{padding:20px 14px 80px}
  .mast-in{padding:12px 14px;gap:10px}
  .yearhead h1{font-size:28px}
  .lhead{display:none}
  .lrow{
    grid-template-columns:1fr auto !important;
    gap:2px 10px;padding:12px 0;position:relative;
  }
  .lrow .cell{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:8px}
  .lrow .cell::before{content:attr(data-l);font-size:11.5px;color:var(--ink-3)}
  .lrow .cell.wide{grid-column:1/-1}
  .lrow input{text-align:left !important;border-bottom-color:var(--rule-2)}
  .lrow .rowtot{grid-column:1/-1;text-align:left;padding-top:6px}
  .del{opacity:1;position:absolute;top:8px;right:0}
  .lrow .cell.grip{position:absolute;top:8px;right:30px;display:flex}
  .lrow .cell.grip::before{content:none}
  .tripcard{grid-template-columns:1fr}
  .tmoney{text-align:left;margin-top:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-in">
    <div class="brand"><b>Rota</b><span>planejador de viagens</span></div>
    <nav class="years" id="years" aria-label="Anos"></nav>
    <button class="iconbtn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
  </div>
</header>

<main id="app"></main>
<div id="overlay"></div>

<script>
"use strict";

/* ============================ moedas ============================ */
const MOEDAS = {
  EUR:{s:"€",n:"Euro"}, USD:{s:"US$",n:"Dólar americano"}, GBP:{s:"£",n:"Libra"},
  CHF:{s:"CHF",n:"Franco suíço"}, JPY:{s:"¥",n:"Iene"}, CAD:{s:"C$",n:"Dólar canadense"},
  AUD:{s:"A$",n:"Dólar australiano"}, ARS:{s:"AR$",n:"Peso argentino"},
  CLP:{s:"CLP",n:"Peso chileno"}, UYU:{s:"$U",n:"Peso uruguaio"},
  MXN:{s:"MX$",n:"Peso mexicano"}, TRY:{s:"₺",n:"Lira turca"},
  ZAR:{s:"R",n:"Rand"}, THB:{s:"฿",n:"Baht"}, MAD:{s:"MAD",n:"Dirham marroquino"},
  EGP:{s:"E£",n:"Libra egípcia"}, CNY:{s:"CN¥",n:"Yuan"}, INR:{s:"₹",n:"Rupia"}
};

/* ============================ categorias ============================ */
/* cada coluna: k=campo, t=tipo, l=rótulo, w=largura na grade */
const CATS = [
  { key:"passagens", nome:"Passagens", cor:"var(--green)", ordenavel:true, buscavel:true,
    add:{de:"",para:"",de:"",para:"",trecho:"",empresa:"",data:"",valor:0,pax:null,cur:"BRL"},
    cols:[
      {k:"rota", t:"rota", l:"De → Para", w:"minmax(0,1.7fr)", wide:1},
      {k:"empresa",t:"text", l:"Cia / obs.", w:"minmax(0,1fr)", ph:"Turkish"},
      {k:"data",   t:"date", l:"Data", w:"130px"},
      {k:"valor",  t:"money",l:"Por pessoa", w:"120px"},
      {k:"pax",    t:"int",  l:"Pax", w:"58px"}
    ],
    calc:(r,t)=> num(r.valor)*paxOf(r,t) },

  { key:"hospedagem", nome:"Hospedagem", cor:"var(--green-2)", buscavel:true,
    add:{local:"",checkin:"",checkout:"",dias:1,diaria:0,qtd:1,cur:"BRL"},
    cols:[
      {k:"local",   t:"text", l:"Local", w:"minmax(0,1.4fr)", ph:"Hotel em Istambul", wide:1},
      {k:"checkin", t:"date", l:"Check-in", w:"126px"},
      {k:"checkout",t:"date", l:"Check-out", w:"126px"},
      {k:"dias",    t:"int",  l:"Diárias", w:"66px"},
      {k:"diaria",  t:"money",l:"Valor/diária", w:"116px"},
      {k:"qtd",     t:"int",  l:"Quartos/pax", w:"78px"}
    ],
    calc:(r)=> num(r.diaria)*num(r.dias)*num(r.qtd||1) },

  { key:"comida", nome:"Comida", cor:"var(--olive)",
    add:{item:"",dias:1,valor:0,pax:null,cur:"BRL"},
    cols:[
      {k:"item", t:"text", l:"Refeição", w:"minmax(0,1.6fr)", ph:"Almoço", wide:1},
      {k:"dias", t:"int",  l:"Dias", w:"70px"},
      {k:"valor",t:"money",l:"Por pessoa/dia", w:"126px"},
      {k:"pax",  t:"int",  l:"Pax", w:"58px"}
    ],
    calc:(r,t)=> num(r.valor)*num(r.dias)*paxOf(r,t) },

  { key:"atracoes", nome:"Atrações", buscavel:true, cor:"var(--gold)",
    add:{local:"",dias:1,porDia:1,valor:0,pax:null,cur:"BRL"},
    cols:[
      {k:"local", t:"text", l:"Local", w:"minmax(0,1.4fr)", ph:"Capadócia", wide:1},
      {k:"dias",  t:"int",  l:"Dias", w:"64px"},
      {k:"porDia",t:"int",  l:"Atrações/dia", w:"92px"},
      {k:"valor", t:"money",l:"Por pessoa", w:"116px"},
      {k:"pax",   t:"int",  l:"Pax", w:"58px"}
    ],
    calc:(r,t)=> num(r.valor)*num(r.porDia)*num(r.dias)*paxOf(r,t) },

  { key:"souvenir", nome:"Souvenir", cor:"var(--clay)",
    add:{item:"",local:"",qtd:1,valor:0,cur:"FX"},
    cols:[
      {k:"item", t:"text", l:"Item", w:"minmax(0,1.2fr)", ph:"Ímãs", wide:1},
      {k:"local",t:"text", l:"Onde", w:"minmax(0,1fr)", ph:"Istambul"},
      {k:"qtd",  t:"int",  l:"Quantidade", w:"92px"},
      {k:"valor",t:"money",l:"Valor unitário", w:"122px"}
    ],
    calc:(r)=> num(r.valor)*num(r.qtd) },

  { key:"diversos", nome:"Diversos", cor:"var(--blue)",
    add:{item:"",obs:"",qtd:1,valor:0,pax:null,cur:"BRL"},
    cols:[
      {k:"item", t:"text", l:"O quê", w:"minmax(0,1.3fr)", ph:"Cruzeiro", wide:1},
      {k:"obs",  t:"text", l:"Observação", w:"minmax(0,1fr)", ph:"Celestyal, 4 noites"},
      {k:"qtd",  t:"int",  l:"Qtd.", w:"64px"},
      {k:"valor",t:"money",l:"Por pessoa", w:"118px"},
      {k:"pax",  t:"int",  l:"Pax", w:"58px"}
    ],
    calc:(r,t)=> num(r.valor)*num(r.qtd)*paxOf(r,t) }
];
const CATMAP = Object.fromEntries(CATS.map(c=>[c.key,c]));

/* ============================ utilidades ============================ */
function num(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  if(v==null||v==="") return 0;
  let s=String(v).trim().replace(/\s/g,"").replace(/[^\d.,-]/g,"");
  if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const fmt=(n,d=2)=>(isFinite(n)?n:0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const brl=n=>"R$ "+fmt(n);
const fx =(n,t)=>(MOEDAS[t.moeda]?MOEDAS[t.moeda].s:t.moeda)+" "+fmt(n);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function paxOf(r,t){ const p=r.pax; return (p==null||p==="")?totalPax(t):num(p); }
function totalPax(t){ return num(t.adultos)+num(t.criancas); }
function diasViagem(t){
  if(!t.inicio||!t.fim) return 0;
  const a=new Date(t.inicio+"T12:00"), b=new Date(t.fim+"T12:00");
  const d=Math.round((b-a)/86400000)+1; return d>0?d:0;
}
function dataBR(s){ if(!s) return "—"; const[y,m,d]=s.split("-"); return d+"/"+m+"/"+y.slice(2); }
function periodo(t){
  if(!t.inicio||!t.fim) return "sem datas";
  const M=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const a=new Date(t.inicio+"T12:00"), b=new Date(t.fim+"T12:00");
  const mesmo=a.getMonth()===b.getMonth();
  return a.getDate()+(mesmo?"":" "+M[a.getMonth()])+"–"+b.getDate()+" "+M[b.getMonth()];
}

/* ---- períodos: data ⇄ dias, em qualquer lugar do app ----
   base=0 → dias = fim − início (diárias/noites: hospedagem e paradas)
   base=1 → dias = fim − início + 1 (dias corridos: a viagem inteira) */
function somaData(iso,n){
  if(!iso) return "";
  const d=new Date(iso+"T12:00"); if(isNaN(d)) return "";
  d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function difData(a,b){
  if(!a||!b) return 0;
  const x=new Date(a+"T12:00"), y=new Date(b+"T12:00");
  if(isNaN(x)||isNaN(y)) return 0;
  return Math.round((y-x)/86400000);
}
/* Regra: mexeu numa data → recalcula os dias; mexeu nos dias → recalcula a data.
   Se o resultado ficaria inválido (fim antes do início), desloca a outra ponta. */
function sincronizarPeriodo(obj,campos,editado,base){
  const A=campos.ini, B=campos.fim, D=campos.dias, b=base||0;
  const ini=obj[A]||"", fim=obj[B]||"", dias=Math.max(0,num(obj[D]));
  if(editado===D){
    const n=Math.max(1,num(obj[D]));
    obj[D]=n;
    if(ini) obj[B]=somaData(ini,n-b);
    else if(fim) obj[A]=somaData(fim,-(n-b));
  }else if(editado===A){
    if(ini&&fim){
      const n=difData(ini,fim)+b;
      if(n>=1) obj[D]=n; else obj[B]=somaData(ini,Math.max(1,dias||1)-b);
    }else if(ini&&dias>0) obj[B]=somaData(ini,dias-b);
  }else if(editado===B){
    if(ini&&fim){
      const n=difData(ini,fim)+b;
      if(n>=1) obj[D]=n; else obj[A]=somaData(fim,-(Math.max(1,dias||1)-b));
    }else if(fim&&dias>0) obj[A]=somaData(fim,-(dias-b));
  }
  return obj;
}
/* atualiza na tela os campos do período que mudaram, sem tocar no que está sendo digitado */
function pintarPeriodo(sel,obj,campos,editado){
  [campos.ini,campos.fim].forEach(k=>{
    if(k===editado) return;
    const e=document.querySelector(sel(k));
    if(e && e.value!==(obj[k]||"")) e.value=obj[k]||"";
  });
  if(campos.dias!==editado){
    const e=document.querySelector(sel(campos.dias));
    const v=fmt(num(obj[campos.dias]),0);
    if(e && e.value!==v) e.value=v;
  }
}

/* ============================ cálculo ============================ */
function compute(t){
  const rate=num(t.cambio)||1, out={cats:{},rows:{},sub:0};
  for(const c of CATS){
    const rows=t[c.key]||[]; let soma=0; out.rows[c.key]=[];
    for(const r of rows){
      const v=c.calc(r,t);
      const b=(r.cur==="FX")? v*rate : v;
      out.rows[c.key].push({brl:b, fxv:b/rate, raw:v});
      soma+=b;
    }
    out.cats[c.key]=soma; out.sub+=soma;
  }
  /* A reserva é uma folga que VOCÊ define: não é o resto de um teto. Assim, mexer
     em pessoas, datas ou lançamentos altera o total, e não a reserva. */
  out.reserva = (t.reservaCur==="FX") ? num(t.reserva)*rate : num(t.reserva);
  out.total   = out.sub + out.reserva;
  out.meta    = (t.metaCur==="BRL") ? num(t.meta) : num(t.meta)*rate;   // teto opcional
  /* tolerância de um centavo: arredondamento de conversão não é estouro de teto */
  const acima = out.total-out.meta;
  out.excedente = (out.meta>0 && acima>0.011) ? acima : 0;
  out.totalFx=out.total/rate;
  out.pax=totalPax(t)||1;
  out.dias=diasViagem(t)||1;
  out.porPessoa=out.total/out.pax;
  out.porPessoaDia=out.total/out.pax/out.dias;
  return out;
}
function totalAno(ano){
  return state.trips.filter(t=>t.ano===ano).reduce((s,t)=>s+compute(t).total,0);
}

/* --- rota de voo: "GRU- GIG", "GRU > GIG", "GRU/GIG" viram De + Para --- */
const SEPARADOR=/\s*(?:→|-{1,2}>|>|\/|\||\bpara\b)\s*|\s+-\s*|\s*-\s+/i;
function partirRota(txt){
  const partes=String(txt||"").split(SEPARADOR).map(x=>x.trim()).filter(Boolean);
  if(!partes.length) return {de:"",para:""};
  return {de:partes[0], para:partes.slice(1).join(" → ")};
}
function rotaTexto(r){
  return [r.de,r.para].filter(x=>x&&String(x).trim()).join(" → ");
}
function migrarViagem(t){
  if(!t) return t;
  (t.passagens||[]).forEach(r=>{
    if(r.de===undefined && r.para===undefined){
      const q=partirRota(r.trecho); r.de=q.de; r.para=q.para;
    }
    r.trecho=rotaTexto(r);
  });
  if(t.guardadoCur===undefined) t.guardadoCur="BRL";
  if(!Array.isArray(t.guardados)){
    t.guardados=[];
    if(num(t.guardado)>0){
      const m=t.guardadoCur==="FX"?(t.moeda||"EUR"):"BRL";
      t.guardados.push({id:uid(),fonte:"Guardado",moeda:m,valor:num(t.guardado),
        taxa:m==="BRL"?1:num(t.cambio)||1});
    }
  }
  if(!t.mostrarEm) t.mostrarEm="BRL";
  if(!t.classeVoo) t.classeVoo="ECONOMY";
  if(t.precoVooTotal===undefined) t.precoVooTotal=true;
  if(!t.quartos) t.quartos=Math.max(1,Math.ceil(totalPax(t)/2));
  if(t.soCafe===undefined) t.soCafe=false;
  if(!t.plano||typeof t.plano!=="object") t.plano={};
  if(t.mesesExtra===undefined) t.mesesExtra=0;
  if(!t.taxas||typeof t.taxas!=="object") t.taxas={};
  /* Pax fixado com o mesmo número de pessoas da viagem vira herdado (em branco):
     o valor não muda hoje, mas passa a acompanhar quando você alterar adultos/crianças. */
  const paxV=num(t.adultos)+num(t.criancas);
  if(paxV>0) CATS.forEach(cat=>{
    (t[cat.key]||[]).forEach(r=>{ if(r.pax!=null && r.pax!=="" && num(r.pax)===paxV) r.pax=null; });
  });
  /* Conversão única do modelo antigo: o que era "resto do teto" vira reserva fixa,
     com o valor que ela tinha no momento da conversão. O teto continua guardado. */
  if(t.reservaModo==="meta" && !t.reservaFixaV2){
    const taxa=num(t.cambio)||1;
    let sub=0;
    CATS.forEach(cat=>(t[cat.key]||[]).forEach(r=>{
      const v=cat.calc(r,t);
      sub += (r.cur==="FX") ? v*taxa : v;
    }));
    const metaBRL=(t.metaCur==="BRL")?num(t.meta):num(t.meta)*taxa;
    const resBRL=Math.max(0, metaBRL-sub);
    t.reserva = t.reservaCur==="FX" ? resBRL/taxa : resBRL;
  }
  if(t.reservaModo!==undefined) delete t.reservaModo;
  t.reservaFixaV2=true;
  if(!Array.isArray(t.roteiro)) t.roteiro=[];
  if(!Array.isArray(t.locais)) t.locais=[];
  t.roteiro.forEach(r=>{ if(!num(r.dias)) r.dias=Math.max(1,difData(r.chegada,r.saida)||1); });
  if(t.iof===undefined) t.iof=3.5;
  return t;
}
function migrarTodas(){ (state.trips||[]).forEach(migrarViagem); }

function sbH(extra){

/* --- fila de gravação --- */
function touch(id){
  const t=state.trips.find(x=>x.id===id);
  if(t) t.atualizadoEm=new Date().toISOString();
  dirty.add(id); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
/* Na abertura, o remoto não pode simplesmente atropelar o que está aqui:
   compara o carimbo de cada viagem e mantém a versão mais nova, reenviando
   ao servidor o que ficou para trás. */
function mesclarViagens(remotos){
  const porId={}; remotos.forEach(r=>{ if(r&&r.id) porId[r.id]=r; });
  const finais=[], reenviar=[];
  for(const loc of state.trips){
    const rem=porId[loc.id];
    if(!rem){ finais.push(loc); reenviar.push(loc.id); continue; }
    delete porId[loc.id];
    const tl=Date.parse(loc.atualizadoEm||"")||0;
    const tr=Date.parse(rem.atualizadoEm||"")||0;
    if(tl>0 && tl>tr){ finais.push(loc); reenviar.push(loc.id); }
    else finais.push(rem);
  }
  Object.keys(porId).forEach(k=>finais.push(porId[k]));
  state.trips=finais; migrarTodas(); saveLocal();
  if(reenviar.length){ reenviar.forEach(id=>dirty.add(id)); flush(); }
  return reenviar.length;
}
async function flush(){
  saveLocal();
  if(!dirty.size||state.salvando) return;
  const ids=[...dirty]; dirty.clear();
  state.salvando=true; paintStatus();
  let falhou=false;
  for(const id of ids){
    const t=state.trips.find(x=>x.id===id);
    try{
      if(state.modo==="supabase"){ t ? await sbGravar(t) : await sbApagar(id); }
      else if(state.modo==="claude" && db){
        if(t) await db.collection("trips").doc(id).set({json:JSON.stringify(t)});
        else  await db.collection("trips").doc(id).delete();
      }
      state.erroSync="";
    }catch(e){
      /* devolve para a fila: uma gravação que falha não pode sumir em silêncio */
      state.erroSync=String(e.message||e); dirty.add(id); falhou=true;
    }
  }
  state.salvando=false;
  if(!falhou) state.sync=new Date();
  paintStatus();
  if(dirty.size){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,6000); }
}

function ajustaAno(){
  if(state.trips.some(t=>t.ano===state.ano)) return;
  const anos=state.trips.map(t=>t.ano).filter(Boolean).sort();
  if(anos.length) state.ano=anos[0];
}

/* --- escolhe onde guardar: Supabase → banco da conta Claude → navegador --- */
async function initStore(){
  try{
    const remotos=await sbListar();
    state.modo="supabase";
    if(!remotos.length){
      for(const t of state.trips) await sbGravar(t);
    }else{
      const pendentes=mesclarViagens(remotos);
      if(!trip()) state.tripId=null;
      ajustaAno(); render();
      if(pendentes) toast(pendentes+(pendentes===1?" viagem enviada":" viagens enviadas")+" que ainda não estavam no banco");
    }
    state.sync=new Date(); state.erroSync=""; paintStatus();
    return;
  }catch(e){ state.erroSync=String(e.message||e); }

  let d=null;
  try{ d = (window.claude&&claude.use) ? await claude.use("db") : null; }catch(e){ d=null; }
  if(d){
    db=d;
    try{
      const snap=await db.collection("trips").get();
      if(snap.empty){ for(const t of state.trips) await db.collection("trips").doc(t.id).set({json:JSON.stringify(t)}); }
      else{
        const r=snap.docs.map(x=>{ try{ return JSON.parse(x.data().json); }catch(e){ return null; } }).filter(Boolean);
        if(r.length){ state.trips=r; migrarTodas(); saveLocal(); if(!trip()) state.tripId=null; ajustaAno(); render(); }
      }
      state.modo="claude"; state.erroSync=""; state.sync=new Date(); paintStatus(); return;
    }catch(e){ db=null; }
  }
  state.modo="local"; saveLocal(); paintStatus();
}

async function recarregar(){
  if(state.modo==="local"){ toast("Nenhum banco conectado"); return; }
  try{
    let r=[];
    if(state.modo==="supabase") r=await sbListar();
    else if(db){ const snap=await db.collection("trips").get();
      r=snap.docs.map(x=>{ try{ return JSON.parse(x.data().json); }catch(e){ return null; } }).filter(Boolean); }
    if(r.length){ mesclarViagens(r); if(!trip()) state.tripId=null; ajustaAno(); }
    state.sync=new Date(); state.erroSync="";
    render(); toast("Atualizado a partir do banco");
  }catch(e){ state.erroSync=String(e.message||e); paintStatus(); toast("Não consegui falar com o banco"); }
}

      <button class="del" data-del="${cat.key}.${r.id}" title="Remover linha" aria-label="Remover linha">×</button>
    </div>`;

  h+=`</div><button class="addrow" data-add="${cat.key}">+ adicionar linha</button>`;
  if(cat.key==="atracoes") h+=`<p class="hint">A lupa busca passeios e ingressos no Booking pelo local da linha, separando as opções com guia e sem guia. O valor é por pessoa.</p>`;
  if(cat.key==="hospedagem") h+=`<p class="hint">As diárias se preenchem sozinhas quando você informa check-in e check-out — e continuam editáveis.</p>`;
  if(cat.key==="souvenir") h+=`<p class="hint">Lançamentos em ${esc(t.moeda)} por padrão; use o botão de moeda para trocar para real.</p>`;
  if(cat.key==="hospedagem") h+=`<p class="hint">A lupa busca hotéis no Booking usando o local e as datas da linha, e traz o valor da diária de um quarto.</p>`;
  if(cat.key==="passagens") h+=`<p class="hint">Pax em branco usa as ${totalPax(t)} pessoas da viagem. Arraste pela alça para reordenar — as datas ficam nas posições. A lupa busca voos do trecho pelo Google Flights.</p>`;

/* ============================ busca de voos ============================ */
/* A chamada vai para /api/voos, uma função do Cloudflare que guarda a chave do
   RapidAPI. O navegador nunca vê a chave, e não há problema de CORS. */
async function buscarVoos(idLinha){
  const t=trip(); if(!t) return;
  const r=(t.passagens||[]).find(x=>x.id===idLinha); if(!r) return;
  const de=String(r.de||"").trim().toUpperCase();
  const para=String(r.para||"").trim().toUpperCase();
  if(!/^[A-Z]{3}$/.test(de)||!/^[A-Z]{3}$/.test(para)){
    toast("Preencha De e Para com o código do aeroporto, como GRU e IST"); return;
  }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.data||"")){ toast("Preencha a data deste trecho"); return; }

  state.voos={linha:idLinha,de,para,data:r.data,carregando:true,erro:"",lista:[],faixa:null};
  state.modal="voos"; renderModal();
  try{
    const resp=await fetch("/api/voos",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({de,para,data:r.data,adultos:num(t.adultos)||1,
                           criancas:num(t.criancas)||0,classe:t.classeVoo||"ECONOMY"})
    });
    const d=await resp.json().catch(()=>({erro:"resposta ilegível"}));
    if(!resp.ok||d.erro) throw new Error(d.erro||("erro "+resp.status));
    state.voos.lista=d.voos||[]; state.voos.faixa=d.faixa||null;
    state.voos.adultos=d.adultos; state.voos.criancas=d.criancas;
  }catch(e){
    state.voos.erro = String(e.message||e);
    if(/Failed to fetch|Unexpected token|<!DOCTYPE/i.test(state.voos.erro))
      state.voos.erro="a função /api/voos não respondeu — ela só existe no site publicado no Cloudflare";
  }
  state.voos.carregando=false; renderModal();
}

function usarVoo(i){
  const t=trip(), v=state.voos; if(!t||!v) return;
  const op=v.lista[i]; if(!op) return;
  const r=(t.passagens||[]).find(x=>x.id===v.linha); if(!r) return;
  const pax=Math.max(1,(num(v.adultos)||0)+(num(v.criancas)||0));
  const porPessoa = t.precoVooTotal ? op.preco/pax : op.preco;
  r.valor=Math.round(porPessoa*100)/100;
  r.cur="BRL";
  r.data=v.data;
  const escTxt = op.escalas===0 ? "direto"
    : op.escalas+" escala"+(op.escalas>1?"s":"")+(op.conexoes.length?" via "+op.conexoes.map(c=>c.cidade||c.codigo).join(", "):"");
  r.empresa=[op.cias.join(" / "), escTxt].filter(Boolean).join(" · ");
  state.modal=null; state.voos=null;
  touch(t.id); render();
  toast("Lançado "+brl(r.valor)+" por pessoa");
}

function hm(min){
  const m=Math.max(0,Math.round(num(min)));
  return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");
}
function modalVoos(){
  const t=trip(), v=state.voos; if(!t||!v) return "";
  const pax=Math.max(1,(num(v.adultos)||num(t.adultos))+(num(v.criancas)||num(t.criancas)));
  const classes=[["ECONOMY","Econômica"],["PREMIUM_ECONOMY","Econômica premium"],
                 ["BUSINESS","Executiva"],["FIRST","Primeira"]];

  let miolo="";
  if(v.carregando){
    miolo=`<p class="previa">Procurando voos de <b>${esc(v.de)}</b> para <b>${esc(v.para)}</b> em <b>${esc(dataBR(v.data))}</b>…</p>`;
  }else if(v.erro){
    miolo=`<p class="previa"><span class="dep">Não consegui buscar: ${esc(v.erro)}.</span></p>`;
  }else if(!v.lista.length){
    /* A causa provável depende de quão longe está a data buscada — não da data da
       viagem. Companhias abrem vendas com cerca de 11 meses de antecedência. */
    const dias=difData(hojeISO(), v.data);
    let causa;
    if(dias>340){
      const abre=somaData(v.data,-330);
      causa=`Essa data está a ${Math.round(dias/30)} meses daqui. As companhias costumam abrir
        vendas com cerca de 11 meses de antecedência, então os preços deste trecho devem aparecer
        por volta de ${esc(rotuloMes(abre.slice(0,7)))}.`;
    }else if(dias<0){
      causa=`Essa data já passou.`;
    }else{
      causa=`Confira se <b>${esc(v.de)}</b> e <b>${esc(v.para)}</b> são códigos de <b>aeroporto</b>.
        Códigos de cidade que agrupam vários aeroportos, como LON para Londres ou NYC para Nova York,
        não são aceitos — use LHR, GIG, JFK e assim por diante. Também pode ser que não exista
        voo entre esses dois aeroportos nesta data.`;
    }
    miolo=`<p class="previa">Nenhum voo com preço para ${esc(dataBR(v.data))}. ${causa}</p>`;
  }else{
    const f=v.faixa;
    if(f){
      const txt = f.nivel==="baixo" ? `Preço <b>abaixo do normal</b> para esta rota (o típico começa em ${brl(f.limiteBaixo)}).`
        : f.nivel==="alto" ? `Preço <b>acima do normal</b> (o típico vai até ${brl(f.limiteAlto)}).`
        : `Preço <b>dentro do normal</b> para esta rota: entre ${brl(f.limiteBaixo)} e ${brl(f.limiteAlto)}.`;
      miolo+=`<p class="aviso ${f.nivel==="baixo"?"bom":(f.nivel==="alto"?"ruim":"neutro")}">${txt}</p>`;
    }
    miolo+=`<div class="mapacts" style="margin:0 0 10px">
      <span class="hint" style="align-self:center">O preço da API é</span>
      <div class="seg">
        <button data-precovoo="total" aria-pressed="${t.precoVooTotal}">total das ${pax}</button>
        <button data-precovoo="pessoa" aria-pressed="${!t.precoVooTotal}">por pessoa</button>
      </div></div>`;
    miolo+=`<div class="voolista">`;
    v.lista.forEach((o,i)=>{
      const porPessoa = t.precoVooTotal ? o.preco/pax : o.preco;
      const total = t.precoVooTotal ? o.preco : o.preco*pax;
      const escTxt = o.escalas===0 ? `<b class="direto">direto</b>`
        : `${o.escalas} escala${o.escalas>1?"s":""} · ${o.conexoes.map(c=>esc(c.cidade||c.codigo)+" "+hm(c.minutos)).join(" · ")}`;
      miolo+=`<button class="vooitem" data-usarvoo="${i}">
        <span class="voocia">${esc(o.cias.join(" / "))}${o.melhor?`<i class="tag">melhor</i>`:""}</span>
        <span class="vooesc">${escTxt}</span>
        <span class="voodur">voo ${hm(o.duracao)}${o.espera?` · espera ${hm(o.espera)}`:""}</span>
        <span class="voopreco"><b>${brl(porPessoa)}</b><i>por pessoa · ${brl(total)} no total</i></span>
      </button>`;
    });
    miolo+=`</div>`;
  }

  return `<div class="scrim" data-scrim="1"><div class="sheet larga" role="dialog" aria-label="Voos">
    <h2>${esc(v.de)} → ${esc(v.para)}</h2>
    <p class="sub">${esc(dataBR(v.data))} · ${pax} ${pax===1?"pessoa":"pessoas"} ·
      <select id="classevoo" style="border:1px solid var(--rule);border-radius:6px;padding:2px 6px;font-size:12.5px;background:var(--panel)">
        ${classes.map(([k,n])=>`<option value="${k}" ${t.classeVoo===k?"selected":""}>${n}</option>`).join("")}
      </select></p>
    ${miolo}
    <div class="acts">
      <button class="btn ghost" data-act="fechar">Fechar</button>
      <button class="btn" data-act="rebuscar" ${v.carregando?"disabled":""}>Buscar de novo</button>
    </div>
  </div></div>`;
}

/* ============================ busca de hotéis ============================ */
/* O Booking devolve o preço TOTAL da estadia somando todos os quartos.
   A função /api/hoteis já divide por noites e por quartos, então o que chega
   aqui é a diária de um quarto — que é exatamente o que a tabela usa. */
async function buscarHoteis(idLinha){
  const t=trip(); if(!t) return;
  const r=(t.hospedagem||[]).find(x=>x.id===idLinha); if(!r) return;
  const cidade=String(r.local||"").trim();
  if(!cidade){ toast("Preencha o local desta linha"); return; }
  if(!r.checkin||!r.checkout){ toast("Preencha check-in e check-out"); return; }
  if(Date.parse(r.checkout)<=Date.parse(r.checkin)){ toast("O check-out precisa ser depois do check-in"); return; }

  state.hoteis={linha:idLinha,cidade,entrada:r.checkin,saida:r.checkout,
                carregando:true,erro:"",lista:[],noites:0};
  state.modal="hoteis"; renderModal();
  try{
    const resp=await fetch("/api/hoteis",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({cidade,entrada:r.checkin,saida:r.checkout,
                           quartos:num(t.quartos)||1, adultos:num(t.adultos)||1,
                           cafe:!!t.soCafe})
    });
    const d=await resp.json().catch(()=>({erro:"resposta ilegível"}));
    if(!resp.ok||d.erro) throw new Error(d.erro||("erro "+resp.status));
    Object.assign(state.hoteis,{lista:d.hoteis||[],noites:d.noites,quartos:d.quartos,
                                cidadeAchada:d.cidade,total:d.total});
  }catch(e){
    state.hoteis.erro=String(e.message||e);
    if(/Failed to fetch|Unexpected token|<!DOCTYPE/i.test(state.hoteis.erro))
      state.hoteis.erro="a função /api/hoteis não respondeu — ela só existe no site publicado no Cloudflare";
  }
  state.hoteis.carregando=false; renderModal();
}

function usarHotel(i){
  const t=trip(), v=state.hoteis; if(!t||!v) return;
  const h=v.lista[i]; if(!h) return;
  const r=(t.hospedagem||[]).find(x=>x.id===v.linha); if(!r) return;
  r.diaria=Math.round(h.diaria*100)/100;
  r.cur="BRL";
  r.qtd=num(t.quartos)||1;

}

/* ============================ busca de atrações ============================ */
/* O Booking devolve o preço POR PESSOA, que é como a tabela trabalha — sem
   conversão. As flags do produto resolvem o "com guia / sem guia". */
async function buscarAtracoes(idLinha){
  const t=trip(); if(!t) return;
  const r=(t.atracoes||[]).find(x=>x.id===idLinha); if(!r) return;
  const cidade=String(r.local||"").trim();
  if(!cidade){ toast("Preencha o local desta linha"); return; }

  state.atr={linha:idLinha,cidade,termo:String(r.termoBusca||"").trim(),
             carregando:true,erro:"",itens:[],filtro:"tudo"};
  state.modal="atracoes"; renderModal();
  try{
    const resp=await fetch("/api/atracoes",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({cidade,termo:state.atr.termo,ordenar:"lowest_price"})
    });
    const d=await resp.json().catch(()=>({erro:"resposta ilegível"}));
    if(!resp.ok||d.erro) throw new Error(d.erro||("erro "+resp.status));
    Object.assign(state.atr,{itens:d.itens||[],faixaGeral:d.faixaGeral,
      faixaComGuia:d.faixaComGuia,faixaSemGuia:d.faixaSemGuia,
      cidadeAchada:d.cidade,pais:d.pais,total:d.total});
  }catch(e){
    state.atr.erro=String(e.message||e);
    if(/Failed to fetch|Unexpected token|<!DOCTYPE/i.test(state.atr.erro))
      state.atr.erro="a função /api/atracoes não respondeu — ela só existe no site publicado no Cloudflare";
  }
  state.atr.carregando=false; renderModal();
}

function usarAtracao(i){
  const t=trip(), v=state.atr; if(!t||!v) return;
  const lista=atrFiltradas(v);
  const a=lista[i]; if(!a) return;
  const r=(t.atracoes||[]).find(x=>x.id===v.linha); if(!r) return;
  r.valor=Math.round(a.preco*100)/100;
  r.cur="BRL";
  r.local=a.nome;
  state.modal=null; state.atr=null;
  touch(t.id); render();
  toast(brl(r.valor)+" por pessoa lançado");
}

function atrFiltradas(v){
  const l=v.itens||[];
  if(v.filtro==="guia") return l.filter(x=>x.comGuia);
  if(v.filtro==="semguia") return l.filter(x=>!x.comGuia);
  return l;
}

/* ============================ plano de pagamento ============================ */
const MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function somaMes(iso,n){
  const [a,m]=String(iso).split("-").map(Number);
  const d=new Date(a,(m-1)+n,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function rotuloMes(iso){
  const [a,m]=String(iso).split("-");
  return MES3[+m-1]+"/"+String(a).slice(2);
}
function hojeISO(){
  const h=new Date();
  return h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0")+"-"+String(h.getDate()).padStart(2,"0");
}
function mesAtual(){
  const h=new Date();
  return h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0");
}
function mesesDoPlano(t){
  let ini=mesAtual(), fim=ini;
  if(t.inicio) fim=t.inicio.slice(0,7);
  if(t.fim && t.fim.slice(0,7)>fim) fim=t.fim.slice(0,7);
  Object.keys(t.plano||{}).forEach(k=>{
    if(/^\d{4}-\d{2}$/.test(k)){ if(k<ini) ini=k; if(k>fim) fim=k; }
  });
  if(num(t.mesesExtra)>0) fim=somaMes(fim,num(t.mesesExtra));
  const out=[]; let c=ini;
  while(c<=fim && out.length<36){ out.push(c); c=somaMes(c,1); }
  return out;
}
function linhasDoPlano(t){
  return CATS.map(c=>({k:c.key,nome:c.nome,cor:c.cor}))
    .concat([{k:"reserva",nome:"Reserva",cor:"var(--slate)"}]);
}
const valPlano=(t,mes,k)=>num((t.plano&&t.plano[mes]&&t.plano[mes][k])||0);
function totalMesPlano(t,mes){
  return linhasDoPlano(t).reduce((s,l)=>s+valPlano(t,mes,l.k),0);
}
function metaDaLinha(t,k,c){
  return k==="reserva" ? c.reserva : c.cats[k];
}
/* Distribui o que falta de cada categoria em parcelas iguais até o mês da partida. */
function distribuirPlano(){
  const t=trip(); if(!t) return;
  const c=compute(t);
  const meses=mesesDoPlano(t).filter(m=> !t.inicio || m<=t.inicio.slice(0,7));
  if(!meses.length){ toast("Sem meses até a partida"); return; }
  t.plano=t.plano||{};
  linhasDoPlano(t).forEach(l=>{
    const meta=metaDaLinha(t,l.k,c);
    const ja=meses.reduce((s,m)=>s+valPlano(t,m,l.k),0)
           + mesesDoPlano(t).filter(m=>meses.indexOf(m)<0).reduce((s,m)=>s+valPlano(t,m,l.k),0);
    const falta=meta-ja;
    if(falta<=0.005) return;
    /* a última parcela recebe a diferença já arredondada, para a soma fechar no centavo */
    const parcela=Math.round((falta/meses.length)*100)/100;
    let posto=0;
    meses.forEach((m,i)=>{
      t.plano[m]=t.plano[m]||{};
      const add = i===meses.length-1 ? Math.round((falta-posto)*100)/100 : parcela;
      posto=Math.round((posto+add)*100)/100;
      t.plano[m][l.k]=Math.round((valPlano(t,m,l.k)+add)*100)/100;
    });
  });
  touch(t.id); render(); toast("Distribuído em parcelas iguais até a partida");
}
function limparPlano(){
  const t=trip(); if(!t) return;
  if(!confirm("Apagar todo o plano de pagamento desta viagem?")) return;
  t.plano={}; touch(t.id); render();
}

function somaPlanejada(t,k){
  return mesesDoPlano(t).reduce((a,m)=>a+valPlano(t,m,k),0);
}
function faltaDaCategoria(t,k,c){
  return Math.round((metaDaLinha(t,k,c)-somaPlanejada(t,k))*100)/100;
}
/* Meses oferecidos no parcelamento: vão bem além da viagem, porque cartão
   costuma terminar depois dela. */
function mesesOpcoes(t){
  let ini=mesAtual();
  Object.keys(t.plano||{}).forEach(k=>{ if(/^\d{4}-\d{2}$/.test(k)&&k<ini) ini=k; });
  const out=[]; let c=ini;
  for(let i=0;i<36;i++){ out.push(c); c=somaMes(c,1); }
  return out;
}
function modalParcelar(){
  const t=trip(); if(!t) return "";
  const c=compute(t);
  const linhas=linhasDoPlano(t);
  const k0=state.pcCat||linhas[0].k;
  const meses=mesesOpcoes(t);
  const mesPadrao=state.pcMes||mesAtual();
  const opCat=linhas.map(l=>{
    const f=faltaDaCategoria(t,l.k,c);
    return `<option value="${l.k}" ${l.k===k0?"selected":""}>${esc(l.nome)} — ${f>0?"falta "+brl(f):(f<0?brl(-f)+" a mais":"fechada")}</option>`;
  }).join("");
  const opMes=meses.map(m=>`<option value="${m}" ${m===mesPadrao?"selected":""}>${esc(rotuloMes(m))}</option>`).join("");
  const faltaK=faltaDaCategoria(t,k0,c);
  return `<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-label="Parcelar categoria">
    <h2>Parcelar uma categoria</h2>
    <p class="sub">Escolha a partir de qual mês e em quantas vezes. As parcelas podem terminar depois da viagem.</p>
    <div class="fields">
      <div class="f span2"><label>Categoria</label><select id="pc_cat">${opCat}</select></div>
      <div class="f"><label>A partir de</label><select id="pc_mes">${opMes}</select></div>
      <div class="f"><label>Parcelas</label><input id="pc_n" type="text" inputmode="numeric" value="${state.pcN||6}"></div>
      <div class="f span2"><label>Valor a parcelar (R$)</label>
        <input id="pc_valor" type="text" inputmode="decimal" value="${fmt(Math.max(0,faltaK))}"></div>
    </div>
    <label class="chk" style="margin:-6px 0 16px"><input type="checkbox" id="pc_sub" checked>
      <span>Substituir o que já está lançado nesta categoria</span></label>
    <p id="pc_preview" class="previa"></p>
    <div class="acts">
      <button class="btn ghost" data-act="fechar">Cancelar</button>
      <button class="btn primary" data-act="lancarparcelas">Lançar parcelas</button>
    </div>
  </div></div>`;
}
function previaParcelas(){
  const el=document.getElementById("pc_preview"); if(!el) return;
  const v=id=>{const e=document.getElementById(id); return e?e.value:"";};
  const n=Math.max(1,Math.round(num(v("pc_n"))));
  const total=num(v("pc_valor")), mesIni=v("pc_mes");
  if(!(total>0)||!mesIni){ el.innerHTML="Informe o valor a parcelar."; el.className="previa"; return; }
  const parcela=Math.round((total/n)*100)/100;
  const ultima=Math.round((total-parcela*(n-1))*100)/100;
  const fim=somaMes(mesIni,n-1);
  const t=trip();
  const depois = t&&t.fim && fim>t.fim.slice(0,7);
  el.className="previa";
  el.innerHTML=`<b>${n}×</b> de <b>${brl(parcela)}</b>`+
    (Math.abs(ultima-parcela)>0.004?` (última de ${brl(ultima)})`:"")+
    `, de <b>${esc(rotuloMes(mesIni))}</b> a <b>${esc(rotuloMes(fim))}</b>.`+
    (depois?` <span class="dep">Termina depois da viagem — as colunas serão criadas.</span>`:"");
}
function lancarParcelas(){
  const t=trip(); if(!t) return;
  const v=id=>{const e=document.getElementById(id); return e?e.value:"";};
  const k=v("pc_cat"), mesIni=v("pc_mes");
  const n=Math.max(1,Math.round(num(v("pc_n"))));
  const total=num(v("pc_valor"));
  const sub=document.getElementById("pc_sub");
  if(!(total>0)){ toast("Informe o valor a parcelar"); return; }
  t.plano=t.plano||{};
  if(sub&&sub.checked) Object.keys(t.plano).forEach(m=>{ if(t.plano[m]) delete t.plano[m][k]; });
  const parcela=Math.round((total/n)*100)/100;
  let posto=0;
  for(let i=0;i<n;i++){
    const m=somaMes(mesIni,i);
    t.plano[m]=t.plano[m]||{};
    const add = i===n-1 ? Math.round((total-posto)*100)/100 : parcela;
    posto=Math.round((posto+add)*100)/100;
    t.plano[m][k]=Math.round(((t.plano[m][k]||0)+add)*100)/100;
  }
  state.pcCat=k; state.pcMes=mesIni; state.pcN=n;
  state.modal=null; state.abertos.plano=true;
  touch(t.id); render();
  toast(`${n}× lançadas a partir de ${rotuloMes(mesIni)}`);
}

        <td class="colfim num" data-calc="plFX"></td><td class="colfim num" data-calc="plFXbrl"></td></tr>

      <button class="del" data-delr="${r.id}" title="Remover parada" aria-label="Remover parada">×</button>
    </div>`;
  });
  h+=`</div>

          placeholder="chave do Google Maps" style="flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;font-size:13px">
        <button class="btn small" data-act="salvarchave">Salvar</button>
        ${chavePropria()?`<button class="btn small" data-act="chavepadrao">Padrão</button>`:""}
      </div>
      <p class="hint" style="margin-top:5px">${chaveGoogle()
        ? "Google Maps em português. A chave fica visível no código da página — restrinja-a por referenciador no Google Cloud Console. Salvar em branco volta ao OpenStreetMap."
        : "Usando OpenStreetMap, com rótulos no idioma local. Informe uma chave do Google Maps para ter os mapas em português."}</p>
      ${state.erroMapa&&chaveGoogle()?`<p class="hint neg" style="margin-top:4px">Última tentativa: ${esc(state.erroMapa)}.</p>`:""}
    </div>

    <div class="mapacts">
      <button class="btn small" data-act="dashosp">Trazer das hospedagens</button>
      <button class="btn small" data-act="localizar" ${state.geocodando?"disabled":""}>
        ${state.geocodando?"Localizando…":"Localizar paradas"}</button>
      <button class="btn primary small" data-act="mostrarmapa" ${loc?"":"disabled"}>Visão geral da viagem</button>
      <button class="btn small" data-act="turismolocal">Turismo local</button>

    <p class="hint">Arraste pela alça para mudar a ordem da viagem — as datas ficam nas posições. ${loc?`${loc} de ${rs.length} ${rs.length===1?"parada localizada":"paradas localizadas"}.`
      :"As coordenadas são buscadas uma vez e ficam guardadas na viagem."}</p>
  </section>`;
  return h;
}
